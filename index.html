/* ---- cards: one cards.json per deck, the deck's pictures in one folder (v35, the owner's pick "per deck") ----
   Cards/<deck>/cards.json: every card of the deck, one per line, {name, card, files: {picture: blob id}}.
   Cards/<deck>/Pictures/<name> scene.jpg, <name> tile.jpg, <name> definition.jpg, <name> definition 2.jpg, <name> source.jpg.
   A card's record in `paths`: {k, flat: true, base: deck folder, dir: <base>/Pictures/<name>, nm, files, sum}.
   The earlier copy of a changed or deleted card goes into that hour's changes.json (the card itself) with its pictures beside it in
   Previous versions, so cards.json is rewritten without a copy of the whole file each time.
   Cards written before v35 had a folder each (Cards/<deck>/<name>/card.json); they move over on the next save. */
const picDir = base => `${base}/Pictures`;
const isTile = n => /(^| )tile\.[^.]+$/.test(n);
const lastPart = p => p.slice(p.lastIndexOf('/') + 1);
const agEntry = (c, files, name) => ({ name, card: c, files });
function agDone(k, at) { if (AG.dirty.get(k) === at) { AG.dirty.delete(k); gstore.del('dirty', [k]).catch(() => {}); } }
/* a deck's cards.json, read once per save; cards change it in memory, and it is written every 100 cards, every 15 s and at the end.
   A card counts as saved (its record kept, its old pictures removed) only once the cards.json holding it is written. */
function agDeckFile(base) {
  let df = AG.decks.get(base);
  if (df) return df;
  df = { base, entries: new Map(), pending: [], changed: false, at: Date.now(), writing: null };
  df.ready = (async () => {
    const f = await agRead(`${base}/cards.json`);
    let j = null; if (f) try { j = JSON.parse(await f.text()); } catch {}
    if (j && Array.isArray(j.cards)) { j.cards.forEach(e => { if (e && e.card && e.card.id) df.entries.set(e.card.id, e); }); return; }
    // missing or unreadable: the cards the phone has written there are written again (an unreadable file is kept first)
    if (f) await agKeep(`${base}/cards.json`, AG.stamp).catch(() => {});
    const redo = [...AG.map.values()].filter(r => r.flat && r.base === base);
    redo.forEach(r => { r.sum = ''; });
    if (redo.length) agWaiting(redo.map(r => r.k));
  })();
  AG.decks.set(base, df);
  return df;
}
async function agDeckWrite(df) {
  while (df.writing) await df.writing;
  if (!df.changed || !agOn()) return;
  df.writing = (async () => {
    df.changed = false; df.at = Date.now();
    const run = df.pending.splice(0);
    try {
      const list = [...df.entries.values()].sort((a, b) => a.name.localeCompare(b.name));
      if (list.length) await agPut(`${df.base}/cards.json`, `{"app":"agora","kind":"cards","version":1,"cards":[\n${list.map(e => JSON.stringify(e)).join(',\n')}\n]}\n`);
      else { await agRemove(`${df.base}/cards.json`); await agRemove(picDir(df.base)); } // the Pictures folder only goes when empty
    } catch (e) {
      console.warn('Agora folder:', df.base, e); df.changed = true; run.forEach(x => AG.failed.add(x.k));
      if (e && e.name === 'NotAllowedError') FX.ready = false;
      return;
    }
    for (const x of run) { try { await x.fn(); } catch (e) { console.warn('Agora folder:', x.k, e); } }
  })().finally(() => { df.writing = null; });
  await df.writing;
}
const agDecksDue = all => Promise.all([...AG.decks.values()].filter(df => df.changed && (all || df.pending.length >= 100 || Date.now() - df.at > 15000)).map(agDeckWrite));

async function agCard(k, id, stamp, at) {
  const c = cards.find(x => x.id === id), rec = AG.map.get(k);
  if (!c) { if (!rec) return; return rec.flat ? agCardGone(k, rec, stamp, at) : agGone(k, rec, 'card', 'card.json', stamp); }
  const d = decks.find(x => x.id === c.deckId); if (!d) return;
  const base = agDeckDir(d), nm = safeName(nameOf(c)) || 'card';
  const dir = rec && rec.flat && rec.base === base && rec.nm === nm ? rec.dir : agUnique(k, picDir(base), nm);
  AG.claim.set(k, dir); // so a card of the same name written alongside takes another name; it holds until the card's cards.json is written
  try { const r = await agCardTo(k, c, rec, base, nm, dir, stamp, at); if (r !== 'later') AG.claim.delete(k); return r; }
  catch (e) { AG.claim.delete(k); throw e; }
}
async function agCardTo(k, c, rec, base, nm, dir, stamp, at) {
  const flatWas = !!rec && !!rec.flat, moved = !!rec && rec.dir !== dir, name = lastPart(dir), pdir = picDir(base);
  // no tile picture: on Android every file is a slow trip, and a tile is redrawn from the scene (agCardIn)
  const slots = [['scene', c.frameId], ...defIdsOf(c).map((b, i) => [i ? `definition ${i + 1}` : 'definition', b]), ['source', c.ref && c.ref.thumbId]]
    .map(([stem, b]) => [`${name} ${stem}`, b]);
  // nothing changed since it was last written
  if (flatWas && !moved && hashOf(JSON.stringify(agEntry(c, rec.files, name))) === rec.sum) {
    const ids = slots.map(x => x[1]).filter(Boolean), had = Object.values(rec.files);
    if (ids.length === had.length && ids.every(b => had.includes(b))) return;
  }
  const df = agDeckFile(base), oldDf = flatWas && rec.base !== base ? agDeckFile(rec.base) : null;
  await df.ready; if (oldDf) await oldDf.ready;
  const was = (oldDf || df).entries.get(c.id) || null;
  const pics = await agPics(pdir, slots, flatWas && !moved ? rec.files : {}, moved || !flatWas, stamp, blobOf);
  // a magazine's PDF is written once, for all the cards that share it
  if (c.pdf && c.pdf.id && !AG.pdfs.has(c.pdf.id)) {
    AG.pdfs.add(c.pdf.id); // first, so a card alongside sharing it doesn't write it too
    const p = `Magazines/${safeName(c.pdf.id.replace(/^pdf-/, '')) || 'magazine'}.pdf`;
    if (!(await agRead(p))) { const b = await blobOf(c.pdf.id); if (b) await agPut(p, b); }
  }
  // the card as it is stored, picture ids included, so it comes back exactly
  const entry = agEntry(c, pics.files, name), sum = hashOf(JSON.stringify(entry));
  if (oldDf) { oldDf.entries.delete(c.id); oldDf.changed = true; }
  df.entries.set(c.id, entry); df.changed = true;
  if (was && (pics.changed || JSON.stringify(was.card) !== JSON.stringify(c))) {
    // the card as it was goes into the list of changes; its pictures, when they change or move, into Previous versions
    if (moved) for (const n of Object.keys(rec.files)) if (!isTile(n)) await agKeep(`${picDir(rec.base)}/${n}`, stamp);
    agLogChange(k, 'card', nameOf(c), cardChange(was.card, c), rec ? rec.dir : dir, { card: was.card, files: was.files });
  }
  const now = new Set(Object.keys(pics.files).map(n => n.toLowerCase()));
  df.pending.push({ k, fn: async () => {
    if (moved && flatWas) { // a new name or deck: the old pictures go (the phone ignores capitals, so a name that only changed case stays)
      for (const n of Object.keys(rec.files)) if (rec.base !== base || !now.has(n.toLowerCase())) await agRemove(`${picDir(rec.base)}/${n}`);
    } else if (moved) await agRemove(rec.dir, true); // its folder from before v35
    await agSave({ k, flat: true, dir, base, nm, label: nameOf(c), files: pics.files, sum });
    if (AG.claim.get(k) === dir) AG.claim.delete(k);
    agDone(k, at);
  } });
  return 'later';
}
/* a deleted card: its pictures go to Previous versions, the card itself into the list of changes */
async function agCardGone(k, rec, stamp, at) {
  const df = agDeckFile(rec.base); await df.ready;
  const id = k.slice(5), was = df.entries.get(id), pdir = picDir(rec.base);
  let any = false;
  for (const n of Object.keys(rec.files)) if (await agKeep(`${pdir}/${n}`, stamp)) any = true;
  if (was || any) agLogChange(k, 'card', rec.label, 'deleted', rec.dir, was ? { card: was.card, files: was.files } : {});
  if (df.entries.delete(id)) df.changed = true;
  const fn = async () => { for (const n of Object.keys(rec.files)) await agRemove(`${pdir}/${n}`); await agForget(k); agDone(k, at); };
  if (!df.changed) { await fn(); return; }
  df.pending.push({ k, fn });
  return 'later';
}
/* a deleted card, deck or note: every file goes to Previous versions, then out of the folder */
async function agGone(k, rec, kind, main, stamp) {
  const dirLike = kind !== 'note';
  const paths = dirLike ? [`${rec.dir}/${main}`, ...Object.keys(rec.files).filter(n => !n.startsWith('tile.') || kind === 'card').map(n => `${rec.dir}/${n}`)]
    : [rec.dir, ...Object.keys(rec.files).map(n => `Notes/pictures/${n}`)];
  let any = false;
  for (const p of paths) if (await agKeep(p, stamp)) any = true;
  if (kind === 'card') await agRemove(rec.dir, true);
  else if (kind === 'deck') { for (const p of paths) await agRemove(p); AG.empty = [...(AG.empty || []), rec.dir]; }
  else for (const p of paths) await agRemove(p);
  if (any) agLogChange(k, kind, rec.label, 'deleted', rec.dir);
  await agForget(k);
}
async function agDeck(k, id, stamp) {
  const d = decks.find(x => x.id === id), rec = AG.map.get(k);
  if (!d) { if (rec) await agGone(k, rec, 'deck', 'deck.json', stamp); return; }
  const nm = safeName(d.name) || 'Deck';
  const dir = rec && rec.nm === nm ? rec.dir : agUnique(k, 'Cards', nm), moved = !!rec && rec.dir !== dir;
  if (moved) {
    // a renamed deck: its folder gets the new name, and each card moves into it
    agWaiting(deckCards(d.id).map(c => 'card:' + c.id));
    await agRemove(`${rec.dir}/deck.json`); for (const n of Object.keys(rec.files)) await agRemove(`${rec.dir}/${n}`);
    AG.empty = [...(AG.empty || []), rec.dir];
  }
  const pics = await agPics(dir, [['cover', d.coverId]], rec && !moved ? rec.files : {}, moved, stamp, blobOf);
  const r = await agText(`${dir}/deck.json`, JSON.stringify({ app: 'agora', kind: 'deck', version: 1, deck: d, files: pics.files }, null, 1),
    rec && !moved ? { sum: rec.sum, dir: `${dir}/deck.json` } : null, stamp);
  if (r.kept != null && !moved) agLogChange(k, 'deck', d.name, 'changed', dir);
  await agSave({ k, dir, nm, label: d.name, files: pics.files, sum: r.sum });
}
/* a note as a page any browser can open: its pictures beside it, and what Agora needs to bring it back in a hidden block */
function notePage(n) {
  const h = noteHead(n), t = document.createElement('template'); t.innerHTML = n.html || '';
  t.content.querySelectorAll('img[data-img]').forEach(img => img.setAttribute('src', `pictures/${img.dataset.img}.jpg`));
  const meta = JSON.stringify({ app: 'agora', kind: 'note', version: 1, id: n.id, title: n.title, imgs: n.imgs || [], createdAt: n.createdAt, updatedAt: n.updatedAt }).replace(/</g, '\\u003c');
  return `<!doctype html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(h.t)}</title>
<style>body{margin:24px auto;max-width:680px;padding:0 18px;background:#000;color:#fff;font:15px/1.65 'IBM Plex Mono',monospace}h1{font-size:22px;font-weight:500}h2{font-size:18px;font-weight:500}img{max-width:100%;border-radius:8px}blockquote{margin:0;padding-left:14px;border-left:2px solid #0086FF;color:#d8d8d8}ul.checks{list-style:none;padding-left:4px}ul.checks li::before{content:'☐  '}ul.checks li.done::before{content:'☑  '}ul.checks li.done{color:#8D9096;text-decoration:line-through}</style>
</head><body>${n.title ? `<h1>${esc(n.title)}</h1>` : ''}
<main id="agora-note-text">${t.innerHTML}</main>
<script type="application/json" id="agora-note">${meta}<\/script>
</body></html>\n`;
}
async function agNote(k, id, stamp) {
  const n = NT.notes.get(id), rec = AG.map.get(k);
  if (!n) { if (rec) await agGone(k, rec, 'note', '', stamp); return; }
  const nm = safeName(noteHead(n).t) || 'Note';
  const path = rec && rec.nm === nm ? rec.dir : agUnique(k, 'Notes', nm, '.html'), moved = !!rec && rec.dir !== path;
  const getPic = async pid => { const r = await nstore.get('images', pid).catch(() => null); return r && r.blob; };
  // pictures are named by their id, so a note keeps them when it is renamed
  const files = {}; let changed = false;
  for (const pid of n.imgs || []) {
    if (rec && rec.files[`${pid}.jpg`]) { files[`${pid}.jpg`] = pid; continue; }
    const b = await getPic(pid); if (!b) continue;
    await agPut(`Notes/pictures/${pid}.jpg`, b); files[`${pid}.jpg`] = pid;
  }
  if (rec) for (const f of Object.keys(rec.files)) if (!files[f]) { if (await agKeep(`Notes/pictures/${f}`, stamp)) changed = true; await agRemove(`Notes/pictures/${f}`); }
  const r = await agText(path, notePage(n), rec && !moved ? rec : null, stamp);
  if (moved) { await agKeep(rec.dir, stamp); await agRemove(rec.dir); changed = true; }
  if (r.kept != null || changed) agLogChange(k, 'note', noteHead(n).t, moved ? `renamed from “${rec.label}”` : 'text changed', path);
  await agSave({ k, dir: path, nm, label: noteHead(n).t, files, sum: r.sum });
}

/* ---- writing what waits ---- */
const UNIT_ORDER = { deck: 0, card: 1, note: 2 };
const AG_SIDE = 8; // cards written side by side
const unitRank = k => UNIT_ORDER[k.split(':')[0]] ?? 3;
function agSoon(ms) {
  if (ms == null) ms = [...AG.dirty.keys()].every(k => k === 'history' || k === 'study') ? 20000 : 4000; // studying writes less often
  clearTimeout(AG.timer); AG.timer = setTimeout(agFlush, ms);
  agPaint();
}
function agFlush() {
  if (AG.run) return AG.run;
  if (!agOn() || !AG.dirty.size) { agPaint(); return Promise.resolve(); }
  AG.run = (async () => {
    const stamp = agStamp(); AG.log = []; AG.done = 0; AG.phase = 'write'; AG.empty = []; AG.runAt = Date.now(); AG.stamp = stamp; AG.decks = new Map(); AG.claim.clear();
    if (AG.why && Date.now() - AG.whyAt > 120000) AG.why = ''; // a reason only holds for the changes right after it
    agBusy(true);
    // .nomedia keeps the cards' pictures out of the phone's Gallery (and spares Android indexing each one)
    if (!AG.nomedia) { if (!(await agRead('.nomedia'))) await agPut('.nomedia', '').catch(() => {}); AG.nomedia = true; }
    let lastPaint = 0;
    const one = async ([k, at]) => {
      if (!agOn()) return;
      try { if (await agWrite(k, stamp, at) !== 'later') agDone(k, at); } // a card is done once its deck's cards.json is written
      catch (e) { console.warn('Agora folder:', k, e); AG.failed.add(k); if (e && e.name === 'NotAllowedError') FX.ready = false; }
      AG.done++;
      if (unitRank(k) === 1) await agDecksDue();
      if (Date.now() - lastPaint > 400) { lastPaint = Date.now(); agPaint(); }
    };
    while (agOn()) {
      const list = [...AG.dirty.entries()].filter(([k]) => !AG.failed.has(k)).sort((a, b) => unitRank(a[0]) - unitRank(b[0]));
      if (!list.length) break;
      AG.total = AG.done + list.length;
      // decks first, then cards several at a time (each card is its own folder, and on Android most of the time is waiting
      // on the system, not copying), then notes and the rest one by one
      const cardsNow = list.filter(([k]) => unitRank(k) === 1);
      for (const x of list.filter(([k]) => unitRank(k) === 0)) await one(x);
      let next = 0;
      await Promise.all(Array.from({ length: AG_SIDE }, async () => { while (next < cardsNow.length && agOn()) await one(cardsNow[next++]); }));
      for (const x of list.filter(([k]) => unitRank(k) > 1)) await one(x);
      await agDecksDue(true);
    }
    // a deck folder left empty (only removed when nothing is in it), and a Pictures folder whose cards all moved out
    for (const df of AG.decks.values()) if (!df.entries.size) await agRemove(picDir(df.base));
    for (const dir of AG.empty) { await agRemove(picDir(dir)); await agRemove(dir); }
    await agWriteLog(stamp, AG.log);
    AG.why = '';
    await agPrune();
    if (AG.failed.size) toast(`Couldn’t save ${plural(AG.failed.size, 'change')} to My Files`);
  })().catch(e => console.warn('Agora folder', e)).finally(() => { agBusy(false); AG.run = null; AG.phase = ''; agPaint(); if (AG.dirty.size > AG.failed.size && agOn()) agSoon(); });
  return AG.run;
}
/* the list of what changed this hour, for the Previous versions page */
async function agWriteLog(stamp, log, every) {
  if (!log.length) return;
  const p = `${VERS}/${stamp}/changes.json`, have = (await agJSON(p)) || { changes: [] };
  // one line per item and hour: the copy kept is the first of the hour, so its first line stays (a file's moves are each their own line)
  const seen = new Set(have.changes.map(x => x.k));
  for (const x of log) if (every || !seen.has(x.k)) { have.changes.push(x); seen.add(x.k); } else { const o = have.changes.find(y => y.k === x.k); o.what = x.what === 'deleted' ? x.what : o.what; o.label = x.label; }
  await agPut(p, JSON.stringify(have, null, 1));
}
/* earlier copies older than 30 days go, once a day */
async function agPrune() {
  if (AG.pruned === dayStart(Date.now())) return;
  AG.pruned = dayStart(Date.now());
  const cut = Date.now() - KEEP_DAYS * 864e5;
  for (const e of await agList(VERS)) if (e.kind === 'directory' && stampTime(e.name) && stampTime(e.name) < cut) await agRemove(`${VERS}/${e.name}`, true);
}
const README = `Agora keeps everything here: your cards, notes, bookmarks and study progress.

Cards/<deck>/          deck.json, cards.json (every card: its words, tags and meanings) and Pictures/ (each card's pictures, by word)
Magazines/             the magazine pages behind some cards
Notes/                 each note as a page any browser can open, with its pictures
Bookmarks.json, Study progress.json, History.json
Previous versions/     the earlier copy of anything Agora changed or deleted, kept for ${KEEP_DAYS} days.
                       Open Agora › Backup (⋯ on the home screen) › Previous versions to bring one back.

On a new phone: install Agora, open My Files and choose this folder's parent (My Files). Agora brings everything back.
Please don't rename or move things inside this folder: Agora finds them by these names.
`;

/* ---- linking a folder: the first time, what the folder already has comes in, then everything is copied there ---- */
async function agLink() {
  if (AG.linking) return AG.linking;
  if (!agReady() || !FX.ready || !FX.root) return;
  if (AG.linked === rootName()) { agSoon(0); return; }
  AG.linking = (async () => {
    agBusy(true); AG.phase = 'read'; AG.done = 0; agPaint();
    const n = await agMerge();
    AG.linked = rootName(); await gstore.put('meta', [{ k: 'linked', v: AG.linked }]).catch(() => {});
    if (!(await agRead('Read me.txt'))) await agPut('Read me.txt', README).catch(() => {});
    // everything on the phone is checked against the folder; what is already there the same is left alone
    agWaiting([...decks.map(d => 'deck:' + d.id), ...cards.map(c => 'card:' + c.id), ...[...NT.notes.keys()].map(id => 'note:' + id), 'study', 'history', 'marks']);
    AG.phase = '';
    if (n) { renderHome(); refreshPages(); toast(`Brought in ${plural(n, 'item')} from My Files › Agora`); }
    agSoon(0);
  })().catch(e => { console.warn('Agora folder', e); toast('Couldn’t read the Agora folder'); }).finally(() => { agBusy(false); AG.linking = null; AG.phase = ''; agPaint(); });
  return AG.linking;
}
/* read the Agora folder into the phone: anything the phone doesn't have yet, and anything newer there. Nothing on the phone is lost. */
async function agMerge() {
  if (!(await agList('')).length) return 0;
  let n = 0; AG.mute = (AG.mute || 0) + 1;
  try {
    const deckIds = new Map(); // the folder's deck id → this phone's deck
    for (const e of await agList('Cards')) {
      if (e.kind !== 'directory') continue;
      const dir = `Cards/${e.name}`, dj = await agJSON(`${dir}/deck.json`);
      let d = null;
      if (dj && dj.deck && dj.deck.id) {
        d = decks.find(x => x.id === dj.deck.id) || decks.find(x => norm(x.name) === norm(dj.deck.name));
        if (!d) {
          d = { ...dj.deck }; const cov = Object.keys(dj.files || {})[0];
          if (cov && d.coverId) { const f = await agRead(`${dir}/${cov}`); if (f) await store.put('blobs', [{ id: d.coverId, blob: f }]); else delete d.coverId; }
          decks.push(d); await store.put('decks', [d]); n++;
        }
        deckIds.set(dj.deck.id, d);
        if (d.id === dj.deck.id) await agSave({ k: 'deck:' + d.id, dir, nm: safeName(d.name) || 'Deck', label: d.name, files: dj.files || {}, sum: '' });
      }
      // the deck's cards.json (v35), and its Pictures folder
      const cj = await agJSON(`${dir}/cards.json`);
      for (const e of (cj && Array.isArray(cj.cards) ? cj.cards : [])) {
        if (!e || !e.card || !e.card.id) continue;
        AG.done++; if (AG.done % 20 === 0) agPaint();
        const k = 'card:' + e.card.id, rec = { k, flat: true, dir: `${picDir(dir)}/${e.name}`, base: dir, nm: safeName(nameOf(e.card)) || 'card', label: nameOf(e.card), files: e.files || {}, sum: hashOf(JSON.stringify(e)) };
        if (cards.some(x => x.id === e.card.id)) { if (!AG.map.has(k)) await agSave(rec); continue; } // the phone's copy is the one in use
        const card = await agCardIn(e.card, e.files || {}, [picDir(dir)], deckIds.get(e.card.deckId) || decks.find(x => x.id === e.card.deckId) || d);
        if (card) { n++; await agSave(rec); }
      }
      // cards saved before v35, a folder each
      for (const c of await agList(dir)) {
        if (c.kind !== 'directory') continue;
        const cdir = `${dir}/${c.name}`, cj = await agJSON(`${cdir}/card.json`);
        if (!cj || !cj.card || !cj.card.id) continue;
        AG.done++; if (AG.done % 20 === 0) agPaint();
        const card = cj.card, files = cj.files || {};
        if (cards.some(x => x.id === card.id)) continue; // the phone's copy is the one in use
        if (!(await agCardIn(card, files, [cdir], deckIds.get(card.deckId) || decks.find(x => x.id === card.deckId) || d))) continue;
        n++;
        await agSave({ k: 'card:' + card.id, dir: cdir, base: dir, nm: safeName(nameOf(card)) || 'card', label: nameOf(card), files, sum: '' });
      }
    }
    // Study progress, History and Bookmarks: the newer record wins, one by one
    const st = await agJSON('Study progress.json');
    if (st && Array.isArray(st.cards)) n += await importStudy({ daily: st.daily, cards: st.cards });
    const hi = await agJSON('History.json');
    if (hi && Array.isArray(hi.visits)) {
      const take = hi.visits.filter(r => r && r.id && +r.at && (!HI.recs.has(r.id) || HI.recs.get(r.id).at < r.at));
      take.forEach(r => HI.recs.set(r.id, r)); if (take.length) await hstore.put('visits', take);
    }
    const bm = await agJSON('Bookmarks.json');
    if (bm && Array.isArray(bm.marks)) {
      n += await importMarks(bm.marks.filter(r => !r.gone));

    vp = dot > vp.lastIndexOf('/') ? `${vp.slice(0, dot)} (${t})${vp.slice(dot)}` : `${vp} (${t})`; }
  await agPut(`${VERS}/${stamp}/${vp}`, f);
  return vp;
}
const fileLog = (stamp, log) => agWriteLog(stamp, log.map(x => ({ kind: 'file', at: Date.now(), run: AG.fileRun || Date.now(), why: '', ...x })), true);
/* the index follows a file or a folder (and everything in it) to its new place, keeping tags and pictures */
async function idxMove(from, to) {
  const moved = [], gone = [];
  for (const r of [...fidx.values()]) {
    if (r.path !== from && !r.path.startsWith(from + '/')) continue;
    const np = to + r.path.slice(from.length), nr = { ...r, path: np, dir: parentOf(np), name: np.slice(np.lastIndexOf('/') + 1) };
    if (nr.kind === 'file') nr.ext = fext(nr.name);
    fidx.delete(r.path); gone.push(r.path); fidx.set(np, nr); moved.push(nr);
    if (FX.handles) FX.handles.delete(r.path);
  }
  fchanged();
  await fstore.del('files', gone).catch(() => {}); await fstore.put('files', moved).catch(storageFail);
  tagsChanged();
}
async function copyInto(src, target, name) {
  if (src.kind === 'file') {
    const f = await src.getFile(), fh = await target.getFileHandle(name, { create: true }), w = await fh.createWritable();
    await w.write(f); await w.close();
    if ((await fh.getFile()).size !== f.size) throw new Error('copy incomplete');
    return;
  }
  const d = await target.getDirectoryHandle(name, { create: true });
  for await (const [n, h] of src.entries()) await copyInto(h, d, n);
}
/* move (or rename) one file or folder; returns its new path */
async function fsMoveOne(from, toDir, newName) {
  const r = fidx.get(from), dir = parentOf(from), name = from.slice(from.lastIndexOf('/') + 1), nm = newName || name;
  if (toDir === dir && nm === name) return from;
  if (r && r.kind === 'dir' && (toDir === from || toDir.startsWith(from + '/'))) throw new Error('into itself');
  const src = r && r.kind === 'dir' ? await (await fsDir(dir)).getDirectoryHandle(name) : await handleOf(from);
  const target = await fsDir(toDir, true), free = await freeName(toDir, nm, toDir === dir && nm.toLowerCase() === name.toLowerCase() ? nm : null);
  let done = false;
  // the phone's own move keeps the file's date; where it isn't there, copy then remove
  if (src.move) { try { await src.move(target, free); done = true; } catch (e) { console.warn('move', e); } }
  if (!done) { await copyInto(src, target, free); await (await fsDir(dir)).removeEntry(name, { recursive: true }); }
  const to = fsJoin(toDir, free);
  await idxMove(from, to);
  return to;
}
async function fsMove(paths, toDir, stamp = agStamp()) {
  const log = [], out = [];
  for (const p of paths) {
    const to = await fsMoveOne(p, toDir); if (to === p) continue;
    const r = fidx.get(to), same = parentOf(p) === parentOf(to);
    log.push({ k: 'file:' + p, op: 'move', path: p, to, label: r ? r.name : to, what: same ? `renamed from “${p.slice(p.lastIndexOf('/') + 1)}”` : `moved from ${fname(parentOf(p))}` });
    out.push(to);
  }
  await fileLog(stamp, log);
  return out;
}
async function fsDelete(paths) {
  const stamp = agStamp(), log = [], gone = [];
  for (const p of paths) {
    const r = fidx.get(p); if (!r || r.kind !== 'file') continue;
    const vp = await fsKeepFile(p, stamp);
    await (await fsDir(r.dir)).removeEntry(r.name);
    log.push({ k: 'file:' + p, op: 'delete', path: p, dir: vp, label: r.name, what: 'deleted', tags: fileTags(r) });
    fidx.delete(p); gone.push(p); if (FX.handles) FX.handles.delete(p); if (r.thumbId) forget([r.thumbId]);
  }
  fchanged(); await fstore.del('files', gone).catch(() => {}); tagsChanged();
  await fileLog(stamp, log);
  return gone.length;
}
async function fsWriteText(path, text, what = 'edited') {
  const stamp = agStamp(), r = fidx.get(path), vp = await fsKeepFile(path, stamp);
  const h = await handleOf(path), w = await h.createWritable(); await w.write(text); await w.close();
  const f = await h.getFile();
  if (r) { Object.assign(r, { size: f.size, mtime: f.lastModified }); fstore.put('files', [r]).catch(storageFail); }
  await fileLog(stamp, [{ k: 'file:' + path, op: 'edit', path, dir: vp, label: r ? r.name : path, what }]);
}
/* Previous versions: a deleted file comes back (beside one that took its name), an edited one gets its old text, a moved one goes back */
async function fileRestore(x) {
  if (!(await fsNeed())) return false;
  if (x.op === 'move') {
    if (!fidx.get(x.to)) return false;
    const stamp = agStamp(), name = x.path.slice(x.path.lastIndexOf('/') + 1), to = await fsMoveOne(x.to, parentOf(x.path), name);
    await fileLog(stamp, [{ k: 'file:' + x.to, op: 'move', path: x.to, to, label: fidx.get(to) ? fidx.get(to).name : name, what: 'moved back' }]);
    return true;
  }
  const f = await agRead(`${VERS}/${x.stamp}/${x.dir}`); if (!f) return false;
  const dir = parentOf(x.path), name = x.path.slice(x.path.lastIndexOf('/') + 1);
  if (x.op === 'edit' && fidx.get(x.path)) { await fsWriteText(x.path, f, 'brought back an earlier copy'); return true; }
  const free = await freeName(dir, name), d = await fsDir(dir, true), fh = await d.getFileHandle(free, { create: true }), w = await fh.createWritable();
  await w.write(f); await w.close();
  const got = await fh.getFile(), path = fsJoin(dir, free), now = Date.now();
  // its folders, if they had gone from the list, and the file with its tags
  const add = [];
  for (let p = dir; p && !fidx.get(p); p = parentOf(p)) add.push({ path: p, kind: 'dir', name: p.slice(p.lastIndexOf('/') + 1), dir: parentOf(p) });
  const r = { path, kind: 'file', name: free, dir, size: got.size, mtime: got.lastModified, ext: fext(free) };
  if (x.tags && x.tags.length) { r.tags = x.tags; r.tagsAt = now; }
  add.push(r); add.forEach(a => fidx.set(a.path, a)); fchanged();
  await fstore.put('files', add).catch(storageFail); tagsChanged(); thumbsLater();
  return true;
}

/* ---- the screens ---- */
function fileDeleteSheet(paths, after) {
  const rs = paths.map(p => fidx.get(p)).filter(Boolean), n = rs.length; if (!n) return;
  const names = rs.slice(0, 2).map(r => esc(r.name)).join(' and ') + (n > 2 ? ` and ${n - 2} more` : '');
  sheet(`<h2>Delete ${n === 1 ? esc(rs[0].name) : plural(n, 'file')}?</h2>
    <p class="note">${n === 1 ? 'It goes' : `${names} go`} to Previous versions in the Agora folder for ${KEEP_DAYS} days, so you can bring ${n === 1 ? 'it' : 'them'} back.</p>
    <div class="btns"><button class="btn" data-act="keep">Keep</button><button class="btn danger" data-act="yes">Delete</button></div>`, {
    keep: () => closeSheet(),
    yes: async () => {
      if (!(await fsNeed())) return;
      let k = 0; try { k = await fsDelete(paths); } catch (e) { console.warn(e); }
      closeSheet(() => { if (after) after(); refreshFiles(); renderHome(); toast(k ? (k === 1 ? `Deleted ${rs[0].name}` : `Deleted ${plural(k, 'file')}`) : 'Couldn’t delete that'); });
    }
  });
}
function fileRenameSheet(path, after) {
  const r = fidx.get(path); if (!r) return;
  askSheet({ title: r.kind === 'dir' ? 'Rename folder' : 'Rename', value: r.name, btn: 'Rename', label: 'New name', max: 255, done: async x => {
    if (x === r.name) { closeSheet(); return; }
    if (badName(x)) { toast('A name can’t have / \\ : * ? " < > |'); return; }
    if (!(await fsNeed())) return;
    let to = null; try { to = await renameTo(path, x); } catch (e) { console.warn(e); }
    closeSheet(() => { if (to) { if (after) after(to); refreshFiles(); toast(`Renamed to ${fidx.get(to) ? fidx.get(to).name : x}`); } else toast('Couldn’t rename that'); });
  } });
  // only the name is picked out, so typing keeps the extension
  setTimeout(() => { const i = $('#askIn'); if (!i) return; const dot = r.kind === 'file' ? r.name.lastIndexOf('.') : -1; i.focus(); i.setSelectionRange(0, dot > 0 ? dot : r.name.length); }, 420); // after the sheet's own select-all
}
async function renameTo(path, name) {
  const stamp = agStamp(), to = await fsMoveOne(path, parentOf(path), name), r = fidx.get(to);
  if (to !== path) await fileLog(stamp, [{ k: 'file:' + path, op: 'move', path, to, label: r ? r.name : name, what: `renamed from “${path.slice(path.lastIndexOf('/') + 1)}”` }]);
  return to;
}
function newFolderSheet(dir, after) {
  askSheet({ title: 'New folder', max: 255, sub: esc(['My Files', ...(dir ? dir.split('/') : [])].join(' › ')), placeholder: 'Folder name', btn: 'Create', done: async x => {
    if (badName(x)) { toast('A name can’t have / \\ : * ? " < > |'); return; }
    if (!(await fsNeed())) return;
    let path = null;
    try {
      const name = await freeName(dir, x); await (await fsDir(dir)).getDirectoryHandle(name, { create: true });
      path = fsJoin(dir, name); const r = { path, kind: 'dir', name, dir }; fidx.set(path, r); fchanged(); await fstore.put('files', [r]).catch(storageFail);
    } catch (e) { console.warn(e); }
    closeSheet(() => { if (!path) { toast('Couldn’t make that folder'); return; } refreshFiles(); if (after) after(path); });
  } });
}
/* moving: full folder pages (pick B2), only folders shown, "Move here" at the bottom */
function startMove(paths) {
  if (!paths.length) return;
  const M = { paths, from: parentOf(paths[0]) };
  newPage({ kind: 'files', dir: '', moving: M });
}
const movingPages = M => pages.filter(p => p.moving === M);
function movingBar(v) {
  const M = v.moving, n = M.paths.length, here = M.paths.every(p => parentOf(p) === v.dir);
  return `<div class="pbar"><button class="iconbtn" data-p="mcancel" aria-label="Stop moving">${ICON.close}</button>
    <div class="ptitle"><span class="selcount" style="flex:none">Moving ${n === 1 ? esc(fidx.get(M.paths[0]) ? fidx.get(M.paths[0]).name : '1 file') : plural(n, 'file')}</span></div></div>`
    + `<div class="mvbar"><span class="to">To: ${esc(fname(v.dir))}</span><button class="btn" data-p="mnew">New folder</button><button class="btn primary" data-p="mhere" ${here ? 'disabled' : ''}>Move here</button></div>`;
}
async function onMovingClick(b, v) {
  const M = v.moving, p = b.dataset.p;
  if (p === 'mcancel') back(null, movingPages(M).length);
  else if (p === 'mnew') newFolderSheet(v.dir, path => newPage({ kind: 'files', dir: path, moving: M }));
  else if (b.dataset.fd != null) { if (!M.paths.includes(b.dataset.fd)) newPage({ kind: 'files', dir: b.dataset.fd, moving: M }); }
  else if (p === 'mhere') {
    if (!(await fsNeed())) return;
    progressSheet('Moving', plural(M.paths.length, 'file'));
    let out = []; try { out = await fsMove(M.paths, v.dir); } catch (e) { console.warn(e); }
    const to = fname(v.dir);
    closeSheet(() => back(() => { refreshFiles(); toast(out.length ? `Moved ${out.length === 1 ? fidx.get(out[0]).name : plural(out.length, 'file')} to ${to}` : 'Couldn’t move that'); }, movingPages(M).length));
  }
}
/* editing a text file: Plex Mono like Notes, saved with Save and when you leave */
function openTextEdit(path) {
  const r = fidx.get(path); if (!r) return;
  newPage({ kind: 'ftext', path, title: r.name, onClose: v => { if (v.text != null && v.box && v.box.value !== v.text) saveText(v, true); } });
}
function renderTextEdit(v) {
  if (v.box) return;
  v.el.innerHTML = `<div class="home">${pageBar(v, '<button class="textbtn" data-p="tsave">Save</button>')}<textarea class="fedit" spellcheck="false" aria-label="Text" placeholder="Opening…" disabled></textarea></div>`;
  v.box = $('.fedit', v.el);
  fsNeed().then(async ok => {
    if (!ok) { v.box.placeholder = 'Agora needs My Files to open this'; return; }
    try { v.text = await (await fileOf(v.path)).text(); v.box.value = v.text; v.box.disabled = false; v.box.placeholder = ''; }
    catch { v.box.placeholder = 'Couldn’t open this file'; }
  });
}
async function saveText(v, leaving) {
  const t = v.box.value; if (t === v.text) { if (!leaving) toast('No changes'); return; }
  try { await fsWriteText(v.path, t); v.text = t; toast('Saved · the earlier copy is in Previous versions'); if (FV) showFile(FV.i, 0); }
  catch (e) { console.warn(e); toast('Couldn’t save the file'); }
}
function onTextClick(e, v) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p === 'back') back();
  else if (b.dataset.p === 'tsave') saveText(v);
}

/* ================= start ================= */
async function seed() {
  const m = await store.get('meta', 'seeded').catch(() => null);
  if (m) return;
  await store.put('meta', [{ k: 'seeded', v: 1 }]).catch(() => {});
  try {
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.blob(); });
    const [f, d] = await Promise.all([get('sample/frame.jpg'), get('sample/definition.jpg')]);
    const deck = newDeck('Slow Horses');
    await addPair(deck, f, d, { word: 'squaddie' });
  } catch (e) { console.warn('sample skipped', e); }
}
(async () => {
  // if the cards take more than a moment (another copy of Agora holding the database), say so instead of a black screen
  const slow = setTimeout(() => { $('#home').innerHTML = '<p class="empty">Opening your cards…</p><p class="note">If Agora is also open in a Chrome tab, close that tab and Agora will carry on.</p>'; }, 2500);
  try { mainDB = await openDB(); store = tracked(idbStore(mainDB), 'main'); } catch (e) { console.warn('IndexedDB unavailable, using memory', e); }
  clearTimeout(slow);
  try { decks = await store.all('decks'); cards = await store.all('cards'); } catch { decks = []; cards = []; }
  cards.forEach(c => { if (!c.defIds || !c.defIds.length) c.defIds = [c.defId]; });
  try {
    if (!(await store.get('meta', 'reviewRules2'))) {
      const marked = cards.filter(c => c.review);
      marked.forEach(c => { c.review = false; c.streak = 0; });
      if (marked.length) await store.put('cards', marked);
      await store.put('meta', [{ k: 'reviewRules2', v: 1 }]);
    }
  } catch (e) { console.warn(e); }
  addEventListener('resize', () => { if (S) fitBands(); });
  try { renderHome(); }
  catch (e) { console.error(e); $('#home').innerHTML = `<p class="empty">Agora couldn’t show your decks. Close it and open it again.</p><p class="note">${esc(e.message)}</p>`; }
  // the files index loads after the decks are on screen, so My Files can never hold them up
  const loads = [
    loadFiles().then(renderHome, e => console.warn(e)),
    loadStudy().then(refreshPages, e => console.warn(e)),
    loadHistory().catch(e => console.warn(e)),
    // bookmarks too; a link shared into Agora opens its save sheet once they are in
    loadMarks().then(() => { renderHome(); takeShared(); }, e => console.warn(e)),
    loadNotes().then(renderHome, e => console.warn(e)),
    loadSync().catch(e => console.warn(e))];
  // then the Agora folder: on a computer it may still be allowed, on a phone it waits for a tap
  Promise.all(loads).then(() => { agPaint(); if (FX.ready) agLink(); });
  // leaving the app: save what waits while the folder is still allowed
  document.addEventListener('visibilitychange', () => { if (document.hidden) agFlush(); });
  // tiles whose scene changed since their picture was made are redrawn once the app has settled
  setTimeout(refreshTiles, 1500);
  if (!decks.length) { await seed(); renderHome(); }
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
