<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Vocabulary decks from the films and shows you watch.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Agora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300;1,700&display=swap">
<style>
:root{
  --ink:#000000; --surface:#111214; --raised:#1C1D20; --line:#26282C;
  --text:#FFFFFF; --muted:#8D9096; --faint:#5A5D63;
  --fs-title:28px; --fs-head:22px; --fs-name:17px;
  --gold:#0086FF; --gold-soft:rgba(0,134,255,.16); --blue-text:#4DA8FF; --danger:#FFFFFF;
  --serif:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --sans:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
/* no pull-to-refresh: it reloads the app and drops you on the home screen */
html{overscroll-behavior:none}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home{max-width:820px;margin:0 auto;padding-inline:20px;padding-block:10px 56px}
.bar h1{margin:0;font-size:var(--fs-title);line-height:1.1}
.bar.title{min-height:56px;margin-right:-8px}
.bar.title + .summary{margin-top:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn:active{background:var(--raised)}
@media (hover:hover){.iconbtn:hover{background:var(--raised)}}
h1{font-family:var(--serif);font-weight:400;font-size:var(--fs-title);line-height:1.05;letter-spacing:-.03em;margin:26px 0 8px;text-wrap:balance}
.summary{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;margin:0}
.due{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;margin-top:22px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}}
.tile{position:relative;min-width:0}
.tile-open{display:flex;flex-direction:column;gap:11px;width:100%}
.cover{aspect-ratio:4/3;width:100%;border-radius:12px;overflow:hidden;background:var(--surface);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.cover img.in{opacity:1}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.tile-name{font-family:var(--serif);font-size:var(--fs-name);font-weight:500;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile-meta{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text)}
.tile.new .cover{background:transparent;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.tile.new .cover::after{display:none}
.tile.new .tile-name{color:var(--muted)}
.empty{color:var(--muted);margin-top:24px;max-width:34ch}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .28s;z-index:60}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:61;max-width:560px;margin:0 auto;background:#000;
  border:1px solid rgba(255,255,255,.08);border-bottom:0;box-shadow:0 -18px 60px rgba(0,0,0,.6);
  border-radius:24px 24px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(calc(100% + var(--kb,0px)));transition:transform .34s var(--ease);max-height:calc(90dvh - var(--kb,0px));overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 18px}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-head);line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13.5px;margin:0;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;margin:12px 0 0;max-width:46ch}
.warn{color:var(--gold);font-size:13.5px;margin:10px 0 0}
.list{display:flex;flex-direction:column;margin-top:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:16px 2px;border-top:1px solid rgba(255,255,255,.07);min-height:60px;font-size:16px}
.item:active{background:rgba(255,255,255,.04)}
.item .ico{display:inline-flex;align-items:center;gap:16px}
.item .ico svg{width:22px;height:22px;color:var(--muted);flex:none}
.item.danger .ico svg{color:inherit}
.item:first-child{border-top:0}
.item .lbl{display:flex;flex-direction:column;gap:2px}
.item .desc{color:var(--muted);font-size:13px}
.item .detail{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;flex:none}
.item.danger{color:var(--text)}
.item .tick{color:var(--gold)}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.btn{flex:1;min-height:50px;border-radius:14px;padding:0 18px;font-weight:500;background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--text);color:var(--ink)}
.btn.danger{background:var(--text);color:var(--ink)}
.field{margin-top:16px}
.field input{width:100%;height:52px;border-radius:14px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:0 16px;font:inherit;font-size:17px}
.field input:focus{outline:none;border-color:var(--gold)}
.pairs{display:flex;flex-direction:column;gap:10px;max-height:44dvh;overflow-y:auto;margin-top:16px;padding-right:2px}
.pair{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.pair .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.pair img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:7px;background:var(--raised);display:block}
.pair img.pdef{object-fit:contain;background:#fff}
.meter{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:18px}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;max-height:42dvh;overflow-y:auto;padding:2px}
.cpick{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface);position:relative}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}
.cpick.on{box-shadow:0 0 0 2px var(--gold)}
/* sheets that ask for one line of text: a floating card, a grey field with a blue underline, text buttons */
.sheet.asking{left:12px;right:12px;bottom:calc(var(--kb,0px) + 12px);border-radius:22px;border-bottom:1px solid rgba(255,255,255,.08);padding:20px 20px 8px}
.sheet.asking .grab{display:none}
.sheet.asking .field{margin-top:18px}
.sheet.asking .field input{border:0;background:var(--raised);caret-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.askbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.askbtns .textbtn{padding:12px 10px;font-size:15px}
.textbtn.quiet{color:var(--muted)}
.peek{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.peek img{width:100%;border-radius:10px;display:block;background:var(--raised)}

/* ---------- cards page ---------- */
.page{position:fixed;inset:0;z-index:30;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.page .home{padding-bottom:110px}
.page.search .home{padding-top:4px}
.page h1{font-size:var(--fs-title);margin-top:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}
@media (max-width:360px){.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:640px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.thumb{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.thumb .pic{aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .w{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;flex:none}
.thumb .dot{position:absolute;top:7px;right:7px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.thumb .sel{position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--gold);background:rgba(0,134,255,.2);
  display:none;place-items:center;color:var(--ink)}
.thumb .sel span{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center}
.thumb.on .sel{display:grid}
.textbtn{color:var(--gold);font-weight:500;padding:10px 6px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.selbar .count{flex:1;color:var(--muted);font-size:14px}
.selbar .btn{flex:none;min-height:44px}

/* ---------- deck pages: sources (page 2) and cards (page 3) ---------- */
.deckpage{touch-action:pan-y}
/* always a pixel taller than the screen, so a pull at the top stays inside the page instead of reloading the app */
.page:not(.search) > .home{min-height:calc(100% + 1px)}
.nsep{color:var(--faint)}
/* the bar: Back, the title and its count, locked at the top while the page scrolls */
.pbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;min-height:60px;margin:-10px -20px 0;padding:8px 10px 8px 6px;background:var(--ink);transition:box-shadow .2s}
.pbar.scrolled{box-shadow:0 1px 0 var(--line)}
.ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.pbar .pt{margin:0;font-size:20px;font-weight:500;line-height:1.25;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ptag{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(0,134,255,.55);color:var(--blue-text);font-size:12px;white-space:nowrap}
.deckpage .summary{margin-top:6px}
.srcs{margin-top:22px}
.src{position:relative;min-width:0}
.src-open{display:grid;width:100%;min-width:0;text-align:left}
/* decks as tiles, like the home screen, each with its own ⋯ */
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
@media (min-width:640px){.srcs{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}}
.src-open{gap:11px}
.srcs .more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text)}
/* a deck's cards: a gallery two across; hold a card to select */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:20px;user-select:none;-webkit-user-select:none}
@media (min-width:640px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;-webkit-touch-callout:none}
.gcard .pic{aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--surface);position:relative}
.gcard img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s;pointer-events:none;-webkit-user-drag:none}
.gcard img.in{opacity:1}
.gcard .dot{position:absolute;top:8px;right:8px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.gcard .w{font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .w.none{color:var(--muted)}
.gcard .box{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.85);
  background:rgba(0,0,0,.35);display:none;place-items:center;color:transparent}
.selecting .gcard .box{display:grid}
.selecting .gcard .dot{display:none}
.selecting .gcard.on .box{background:var(--gold);border-color:var(--gold);color:#fff}
.selcount{flex:1;font-size:17px;padding-left:4px}

/* ---------- Study: the banner on Vocabulary's page, today's cards, the queue of new cards ---------- */
.sban{display:block;width:100%;text-align:left;margin-top:22px;padding:18px 18px 20px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sban .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sban .n{font-size:var(--fs-name);font-weight:500}
.sban .go{color:var(--blue-text);font-size:14px;white-space:nowrap}
.sban .go.quiet{color:var(--muted)}
.sban .m{color:var(--muted);font-size:12.5px;margin-top:6px}
.sbar{height:3px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gold)}
.sstart{display:flex;width:100%;height:52px;border-radius:14px;background:var(--gold);color:#fff;font-weight:500;font-size:16px;align-items:center;justify-content:center;margin-top:22px}
.sstart:active{opacity:.85}
.gcard .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;line-height:1.5;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.gcard .lbl.r{color:var(--blue-text)}
.gcard.gdone .pic,.gcard.gdone .w{opacity:.35}
.gcard .qn{position:absolute;left:8px;top:8px;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;display:grid;place-items:center}
.qlist{display:flex;flex-direction:column;margin-top:14px;user-select:none;-webkit-user-select:none}
.qrow{display:grid;grid-template-columns:28px 76px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left;-webkit-touch-callout:none}
.qrow:first-child{border-top:0}
.qrow .i{color:var(--faint);font-size:12.5px;text-align:right}
.qrow .pic{width:76px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--surface)}
.qrow img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s;pointer-events:none;-webkit-user-drag:none}
.qrow img.in{opacity:1}
.qrow .qm{display:flex;flex-direction:column;gap:2px;min-width:0}
.qrow .w{font-size:var(--fs-name);font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .w.none{color:var(--muted);font-weight:400;font-size:15px}
.qrow .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .box{display:none;width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);place-items:center;color:transparent;justify-self:center}
.selecting .qrow .i{display:none}
.selecting .qrow .box{display:grid}
.selecting .qrow.on .box{background:var(--gold);border-color:var(--gold);color:#fff}
.qfront{margin-right:6px;font-size:15px}
.qfront:disabled{color:var(--faint)}
.qsearch{margin:-10px -20px 0;padding:8px 12px 10px}
.qsearching .sugg{padding-top:2px}

/* ---------- study ---------- */
.study{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;animation:fadein .25s ease;--hd:104px;--ft:calc(env(safe-area-inset-bottom,0px) + 52px)}
.noanim *,.noanim *::before,.noanim *::after{transition:none !important}

@keyframes fadein{from{opacity:0}}
.study *{touch-action:none}
.study img{-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none}
.stage{position:absolute;left:0;right:0;top:var(--hd);bottom:var(--ft);overflow:hidden}
/* every page of a card lives inside the band between the header and the footer, so nothing slides over the word or the tags */
.slide{position:absolute;inset:0;will-change:transform,opacity;transition:transform .32s var(--ease),opacity .32s var(--ease)}
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:transform,opacity}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.def{position:absolute;inset:0;opacity:0;transform:translateY(100%);overflow:hidden;touch-action:none;will-change:transform,opacity}
.def .scroll,.ref .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;touch-action:none}
.def .scroll::-webkit-scrollbar,.ref .scroll::-webkit-scrollbar{display:none}
.def .dwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px 0}
.def .dimg{width:100%}
.def img{width:100%;height:auto;display:block;border-radius:0}
.def .more{align-self:center;margin-top:26px;font-size:12.5px;color:var(--muted);padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums}
.def .more b{color:var(--gold);font-weight:500}
.frame img{transform-origin:50% 50%;will-change:transform}
/* definitions as text: white and blue on black */
.dtext{width:100%;max-width:560px;padding:0 22px;font:15px/1.6 var(--sans);color:#fff;overflow-wrap:anywhere;letter-spacing:0}
.dtext > * + *{margin-top:14px}
.dtext strong{font-weight:600}
.dtext .t-tag{font-size:11px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dtext .t-headword{font-size:34px;line-height:1.1;color:#0086FF;letter-spacing:-.01em;margin-bottom:6px;overflow-wrap:normal}
.dtext .t-headword.long{font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.dtext .t-heading{font-size:17px;line-height:1.35;color:#0086FF;padding-bottom:10px;border-bottom:2px solid #E6E9EE;text-wrap:balance}
.dtext * + .t-heading{margin-top:30px}
.dtext .t-heading:has(+ .t-meta){border-bottom:0;padding-bottom:0}
.dtext .t-heading + .t-meta{margin-top:2px}
.dtext .t-subheading{font-weight:500;line-height:1.4;color:#0086FF;margin-top:24px}
.dtext .t-pron{display:flex;flex-wrap:wrap;gap:6px 22px}
.dtext .t-pron span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.dtext .t-pron svg{width:18px;height:18px;flex:none}
.dtext .t-rule{height:0;border-top:2px solid #E6E9EE;margin-top:20px;margin-bottom:6px}
.dtext .t-def .n{color:#0086FF;margin-right:.6em}
.dtext .t-ex{color:#0086FF;font-style:italic}
.dtext .t-ex .lead{color:#fff;font-style:normal;font-weight:600;margin-right:.5em}
.dtext .t-def + .t-ex{margin-top:20px}
.dtext .t-ex + .t-def{margin-top:24px}
.dtext .t-guide,.dtext .t-phrase{color:#0086FF;margin-top:22px}
.dtext .t-label{font-weight:600;margin-top:24px}
.dtext .t-label + *{margin-top:2px}
.dtext .t-quote{border-left:2px solid #3A4250;padding-left:14px}
.dtext ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.dtext li{padding-left:1.4em;text-indent:-1.4em}
.dtext li::before{content:"•";display:inline-block;width:1.4em;text-indent:0}
.peek .ptext{background:#000;border-radius:10px;padding:18px 0;max-height:40dvh;overflow:hidden}
.peek .ptext .dtext{padding:0 16px;font-size:13px}
.peek .ptext .t-headword{font-size:26px}
.rd mark{background:none;color:var(--gold)}
.chrome{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;flex-wrap:wrap;row-gap:0;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}
.chrome > .iconbtn{margin-right:2px}
/* a single tap hides the header and footer, and the next brings them back; the pages keep their place between the bands */
.chrome{transition:opacity .25s var(--ease)}
.study.bare .chrome,.study.bare .foot{opacity:0;pointer-events:none}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:14px;height:var(--ft);
  padding:0 20px env(safe-area-inset-bottom,0px);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;transition:opacity .25s;pointer-events:none}
/* Study: Continue, or Repeat / Tomorrow / Pass, in one bar under the card, with when the card comes back */
.study.drill{--ft:calc(env(safe-area-inset-bottom,0px) + 124px)}
.study.drill .foot{height:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
.answer{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  height:56px;border-radius:16px;background:var(--raised);overflow:hidden}
.answer button{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.3;color:var(--text);border-left:1px solid rgba(255,255,255,.08)}
.answer button:first-child{border-left:0}
.answer button:active{background:rgba(255,255,255,.05)}
.answer .p{color:var(--blue-text);font-weight:500}
.answer small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.sdone{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;background:#000;animation:fadein .25s ease}
.sdone h2{font-size:var(--fs-head);font-weight:500;margin:0 0 10px;letter-spacing:-.02em}
.sdone p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.sdone .textbtn{margin-top:26px;font-size:15px}
.wordbtn{min-width:0;max-width:calc(100vw - 80px);padding:8px 10px;font-size:var(--fs-head);font-weight:500;letter-spacing:-.02em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:10px}
.wordbtn.empty{font-size:16px;font-weight:400;color:var(--muted)}
/* renaming in place: the title becomes a highlighted field */
.wordedit{min-width:0;width:calc(100vw - 84px);height:44px;margin:0;padding:0 10px;border:0;border-radius:10px;outline:none;
  font:500 var(--fs-head)/1 var(--sans);letter-spacing:-.02em;color:#fff;caret-color:var(--gold);
  background:rgba(0,134,255,.14);box-shadow:inset 0 -2px 0 var(--gold);animation:fadein .15s ease}
.wordedit::placeholder{color:var(--muted)}
.wordedit::selection{background:rgba(0,134,255,.45)}
.study.renaming .wordedit{user-select:text;-webkit-user-select:text;touch-action:auto}
.wordbtn:active{background:rgba(255,255,255,.08)}
.head{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.tags{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;padding:4px 10px 6px}
.tags:not(:has(.tag)):not(.editing){display:none}
.tag{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(0,134,255,.55);
  color:var(--blue-text);font-size:13.5px;white-space:nowrap;transition:background .15s,padding .15s}
.tag:active{background:rgba(0,134,255,.12)}
.tag .x{display:none;align-items:center;justify-content:center;width:22px;height:22px;margin-right:-6px;border-radius:50%;background:rgba(0,134,255,.22);color:#fff}
.tag .x svg{width:12px;height:12px}
.tags.editing .tag{padding-right:10px;background:rgba(0,134,255,.08)}
.tags.editing .tag .x{display:inline-flex}
/* at most three tags show; the small count pill opens the rest */
.tagmore{display:inline-flex;align-items:center;justify-content:center;gap:1px;height:34px;min-width:34px;padding:0 4px;border-radius:999px;
  color:var(--blue-text);font-size:13.5px;font-variant-numeric:tabular-nums}
.tagmore:active{background:rgba(0,134,255,.12)}
.tagmore svg{width:16px;height:16px}
/* while tags are being edited, a round + adds one */
.tagadd{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,134,255,.55);color:var(--blue-text)}
.tagadd svg{width:16px;height:16px}
.tagadd:active{background:rgba(0,134,255,.12)}
.tags.editing .tagadd{display:inline-flex}
/* reference page: above the scene, reached by swiping down */
.ref{position:absolute;inset:0;opacity:0;transform:translateY(-100%);overflow:hidden;touch-action:none;will-change:transform,opacity}
/* articles as text: a serif reading face on black, the word boxed in magenta like the reader's selection */
.frame.art{display:flex;align-items:center;justify-content:center}
.atext{width:100%;max-width:600px;padding:0 16px;font:300 16px/1.66 'Merriweather',Georgia,'Times New Roman',serif;color:#E4E4E4;
  letter-spacing:0;overflow-wrap:break-word;hyphens:manual;font-variant-ligatures:common-ligatures;-webkit-font-smoothing:antialiased}
.atext p{margin:0}
.atext p + p,.atext h3 + p,.atext p + h3{margin-top:1.05em}
.atext h3{margin:0;font:700 17px/1.5 'Merriweather',Georgia,serif;color:#fff}
.atext.solo h3{font-size:24px;line-height:1.4;letter-spacing:-.005em}
.atext strong{font-weight:700;color:#fff}
.atext em{font-style:italic}
.atext mark{background:#84024C;color:#fff;padding:.14em 0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* a video still with its subtitle cue underneath: Plex Mono light, the word in blue */
.frame.cap .fcap{width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center}
.frame.cap img{width:100%;height:auto;min-height:0;flex:0 1 auto;object-fit:contain}
.scap{flex:none;margin:0;padding:18px 20px 0;width:100%;max-width:600px;font:300 14px/1.65 var(--sans);color:#E4E4E4;text-align:center;text-wrap:balance}
.scap mark{background:none;color:#4DA8FF}
/* magazine pages: the PDF fits the width, scrolls, zooms; the word is outlined in the same magenta */
.frame.pdf{display:block}
.pscroll{position:absolute;inset:0;overflow:hidden}
.ppage{position:relative;background:#111;transform-origin:0 0}
.ppage canvas,.ppage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pmark{position:absolute;border-radius:3px;background:rgba(214,18,122,.30);box-shadow:0 0 0 2px #E0187F,0 0 14px rgba(224,24,127,.55);pointer-events:none}
.pwait{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(0,0,0,.7);padding:5px 12px;border-radius:999px;transition:opacity .3s}
.pwait.gone{opacity:0}
.ref .rwrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:12px 0}
.r-tr{width:100%;max-width:560px;margin:0 auto;padding:0 22px;font:16px/1.6 var(--sans);color:var(--muted);overflow-wrap:anywhere}
.r-tr p{margin:0}
.r-tr p + p{margin-top:14px}
.r-tr p.hit{color:#fff}
.r-tr mark{background:none;color:#0086FF}
.r-vid,.dvid{display:flex;flex-direction:column;gap:16px;width:100%;max-width:720px;margin:0 auto;cursor:pointer}
.r-vid .pic,.dvid .pic{width:100%;aspect-ratio:16/9;background:var(--surface);overflow:hidden}
.r-vid .pic img,.dvid .pic img{width:100%;height:100%;object-fit:cover;display:block}
.r-vid .ttl,.dvid .ttl{padding:0 22px;font:italic 300 16px/1.6 'Merriweather',Georgia,serif;color:#D8D8D8;text-wrap:pretty}
.r-art{width:100%;max-width:560px;margin:0 auto;padding:0 22px;color:#fff}
.r-art .blk{max-width:340px}
.r-art .blk[data-href]{cursor:pointer}
.r-art .ttl{font:400 17px/1.3 var(--sans);letter-spacing:0;text-wrap:pretty;padding-bottom:12px;border-bottom:1.5px solid #E6E9EE}
.r-art .site{display:inline-flex;align-items:center;gap:12px;margin-top:14px;font:400 17px/1.3 var(--sans);color:#3D9BFF}
.r-art .blk[data-href] .site span{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.r-art .site svg{width:19px;height:19px;flex:none}
/* search: tag suggestions and pinned tags */
.pins{display:flex;gap:6px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.pins::-webkit-scrollbar{display:none}
.pin{display:inline-flex;align-items:center;height:34px;flex:none;max-width:170px;padding:0 14px;border-radius:999px;background:rgba(0,134,255,.2);color:#8CC6FF;font-size:13.5px;white-space:nowrap}
.pin b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* the search bar: one quiet pill with Back, the tags, the field and a clear button */
.qwrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:56px;border-radius:28px;background:var(--raised);padding:0 4px}
.qwrap .iconbtn{width:46px;height:46px;color:var(--text)}
.qwrap .qclear{color:var(--muted)}
.qwrap input{flex:1;min-width:36px;height:100%;background:none;border:0;color:var(--text);caret-color:var(--gold);padding:0 8px;font:inherit;font-size:17px;-webkit-appearance:none;appearance:none}
.qwrap input::placeholder{color:var(--muted)}
.qwrap input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.qwrap input:focus{outline:none}
/* the result count, with Create deck beside it */
.rhead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;margin:4px 0 2px}
.rhead .textbtn{margin-right:-6px}
.fhead:not(:first-child){margin-top:26px}
.res .gly{width:76px;aspect-ratio:16/10;border-radius:6px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.res img.fth{object-position:top}
.ftagsheet .field input{border:0;background:var(--raised);caret-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 14px}
.sugg button{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(0,134,255,.55);color:#4DA8FF;font-size:13.5px}
.sugg button i{font-style:normal;color:var(--muted);font-size:12px}
.sugg button mark{background:none;color:#fff}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translateX(-50%);z-index:3;
  display:grid;grid-template-columns:auto auto;gap:8px 26px;white-space:nowrap;font-size:13px;color:var(--text);padding:14px 22px;border-radius:18px;
  border:1px solid rgba(255,255,255,.1);background:rgba(12,13,15,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .4s}
.hint b{color:var(--blue-text);font-weight:500;margin-right:6px}
.hint.gone{opacity:0;pointer-events:none}

/* ---------- search ---------- */
.tools{display:flex;gap:2px;margin-right:-8px}
.searchbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;padding:8px 12px 10px;background:var(--ink)}
.results{display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res img{width:76px;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--surface);display:block}
.res > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.rw{font-family:var(--serif);font-size:var(--fs-name);font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.rw mark{background:none;color:var(--gold)}
.rd{font-size:12.5px;color:var(--muted)}
.wordin{grid-column:2 / 4;height:40px;border-radius:10px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:0 12px;font:inherit;font-size:16px;margin-bottom:6px}
.wordin:focus{outline:none;border-color:var(--gold)}
.sheet h2.muted{color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,12px);z-index:80;
  display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px);
  background:rgba(12,13,15,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 44px rgba(0,0,0,.55);
  color:#fff;font-size:14px;line-height:1.45;font-weight:400;padding:13px 18px 13px 16px;border-radius:16px;
  opacity:0;transition:opacity .25s,transform .3s var(--ease);pointer-events:none;text-align:left}
.in-study .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
.in-drill .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 136px)}
.item .lbl:has(.ico) .desc{padding-left:38px}
.toast::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(0,134,255,.18);flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- My Files ---------- */
/* the logos on the Vocabulary and My Files tiles (the owner's pick 2B): white with one touch of blue */
.cover .logo{position:absolute;inset:0;display:grid;place-items:center;color:var(--text)}
.logo-aa{font-family:var(--sans);font-weight:300;font-size:46px;letter-spacing:-.02em;line-height:1}
.logo-aa b{font-weight:inherit;color:var(--gold)}
.fsoff{color:var(--muted);font-size:13.5px;margin-top:30px;max-width:40ch}
/* the path above the count: My Files › Documents › Bank */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin:4px 0 0;color:var(--muted);font-size:13.5px}
.crumbs button{padding:4px 2px;color:var(--muted)}
.crumbs b{font-weight:400;color:var(--text);padding:4px 2px}
.crumbs i{font-style:normal;color:var(--faint);padding:0 2px}
.crumbs + .summary{margin-top:0}
/* the one quiet line that asks for the folder */
.connect{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 0;font-size:14.5px;text-align:left}
.connect .dot{flex:none}
.connect b{font-weight:500;color:var(--blue-text)}
.connect span{color:var(--muted);font-size:13px}
/* list view: a small picture, the name, kind · size · date, the tags */
.flist{display:flex;flex-direction:column;margin-top:14px;user-select:none;-webkit-user-select:none}
.frow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line);-webkit-touch-callout:none}
.frow:first-child{border-top:0}
.frow:active{background:rgba(255,255,255,.03)}
.fic{width:56px;height:56px;border-radius:8px;background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--muted);position:relative}
.fic img,.fpic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;opacity:0;transition:opacity .25s;pointer-events:none}
.fic img.in,.fpic img.in{opacity:1}
.fic .ext,.fpic .ext{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fic.glyph svg{margin-top:-9px}
.fmain{display:flex;flex-direction:column;min-width:0}
.fn{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftags{display:flex;gap:6px;margin-top:6px;overflow:hidden;align-items:center}
.ftags .ptag{flex:none}
.ftags .fm{margin:0}
.frow .go{color:var(--faint)}
.fbox{display:none;width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.35);place-items:center;color:transparent}
.selecting .fbox,.tagging .fbox{display:grid}
.selecting .on .fbox,.tagging .on .fbox{background:var(--gold);border-color:var(--gold);color:#fff}
.selecting .frow .go,.tagging .frow .go{visibility:hidden}
/* grid view: two across, like a deck's cards */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:20px;user-select:none;-webkit-user-select:none}
@media (min-width:640px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fcard{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;-webkit-touch-callout:none}
.fpic{aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
.fpic .ext{bottom:10px;font-size:10px}
.fpic.glyph svg{margin-top:-10px}
.fpic .fbox{position:absolute;top:8px;right:8px}
.fcard .fn{font-size:14px;line-height:1.25}
.fcard .fm{margin-top:-4px;font-size:12px}
.fcard .fm .tg{color:var(--blue-text)}
/* tag pills in sheets: filled when the tag is on, outlined to add */
.slabel{color:var(--muted);font-size:13px;margin:20px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(0,134,255,.55);color:var(--blue-text);font-size:13.5px;white-space:nowrap;max-width:100%}
.chip.on{background:rgba(0,134,255,.2);border-color:transparent;color:#8CC6FF}
.chip:active{background:rgba(0,134,255,.12)}
.chip i{font-style:normal;color:var(--muted);font-size:12px}
.chip span{overflow:hidden;text-overflow:ellipsis}
.pbar .chip{flex:none;margin-left:2px}
/* opening a file: name and tags on top, the file in the middle, position and Share at the bottom */
.fview{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;animation:fadein .25s ease;--vh:104px;--vf:calc(env(safe-area-inset-bottom,0px) + 56px)}
.fview .chrome .vt{flex:1;min-width:0;padding:8px 6px;font-size:18px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstage{position:absolute;left:0;right:0;top:var(--vh);bottom:var(--vf);overflow:hidden;touch-action:none}
.vslide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;transition:transform .3s var(--ease),opacity .3s var(--ease)}
.vslide.drag{transition:none}
.vslide img.full{max-width:100%;max-height:100%;object-fit:contain;display:block;transform-origin:50% 50%;will-change:transform;pointer-events:none;-webkit-user-drag:none}
.vslide video{max-width:100%;max-height:100%}
.vslide audio{width:calc(100% - 40px)}
.vtext{position:absolute;inset:0;overflow:auto;padding:4px 20px 20px;touch-action:pan-y;overscroll-behavior:contain}
.vtext pre{margin:0;font:300 14px/1.65 var(--sans);color:#E4E4E4;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.vpdf{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.vpdf.zoomed{touch-action:pan-x pan-y}
.vpages{transform-origin:0 0;padding:4px 0 12px}
.vpage{position:relative;background:#f4f4f2;margin:0 auto}
.vpage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vother{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 30px;text-align:center;color:var(--muted)}
.vother .fn{color:var(--text);font-size:17px;white-space:normal;overflow-wrap:anywhere;margin-top:14px}
.vother .btn{margin-top:22px;flex:none}
.vwait{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(0,0,0,.7);padding:5px 12px;border-radius:999px}
.vslide .connect{position:absolute;left:20px;right:20px;bottom:6px;justify-content:center;background:rgba(0,0,0,.75);border-radius:14px;padding:10px}
.vfoot{position:absolute;left:0;right:0;bottom:0;height:var(--vf);display:flex;align-items:center;gap:14px;padding:0 10px env(safe-area-inset-bottom,0px) 20px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vfoot .textbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:15px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

</head>
<body>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>

<input id="picker" type="file" accept="image/*" multiple hidden>

<input id="zipPicker" type="file" accept=".zip,application/zip" multiple hidden>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
// small settings; the app was called Subtext before v22, so settings saved under that name still count
const ls = {
  get(k) { try { return localStorage.getItem('agora.' + k) ?? localStorage.getItem('subtext.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('agora.' + k, v); } catch {} }
};
const svg = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
// the logos on the Vocabulary and My Files tiles (the owner's pick 2B): a white A with a blue a, a white folder with a blue tab
const LOGO_VOCAB = '<span class="logo" aria-hidden="true"><span class="logo-aa">A<b>a</b></span></span>';
const LOGO_FILES = '<span class="logo"><svg width="72" height="72" viewBox="0 0 48 48" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M6 16V36a2 2 0 0 0 2 2h32a2 2 0 0 0 2-2V18a2 2 0 0 0-2-2H6z" stroke="currentColor"/>'
  + '<path d="M7.3 15.3V13.5a1.6 1.6 0 0 1 1.6-1.6h8.4l2.9 3.4z" style="fill:var(--gold);stroke:var(--gold)"/></svg></span>';
const ICON = {
  more: `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 26),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 16),
  edit: svg('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>', 20),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  image: svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8.5"/>'),
  trash: svg('<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7M10.2 10.5v5.5M13.8 10.5v5.5"/>'),
  flag: svg('<path d="M6 20.5V4.5M6 5h11l-2.2 4L17 13H6"/>'),
  unflag: svg('<path d="M6 20.5V4.5M6 5h11l-2.2 4L17 13H6"/><path d="M4 3l16 18"/>'),
  tag: svg('<path d="M3.5 12.2V4.5h7.7l9.3 9.3-7.7 7.7z"/><circle cx="8" cy="9" r="1.4"/>')
};
const ico = (name, label) => `<span class="ico">${ICON[name]}<span>${label}</span></span>`;

/* ================= storage ================= */
const STORES = ['decks', 'cards', 'blobs', 'meta'];
const KEYS = { decks: 'id', cards: 'id', blobs: 'id', meta: 'k', files: 'path' };
function idbStore(db) {
  const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    all: name => req(db.transaction(name).objectStore(name).getAll()),
    get: (name, key) => req(db.transaction(name).objectStore(name).get(key)),
    put(name, vals) { const t = db.transaction(name, 'readwrite'); const s = t.objectStore(name); vals.forEach(v => s.put(v)); return done(t); },
    del(name, keys) { const t = db.transaction(name, 'readwrite'); const s = t.objectStore(name); keys.forEach(k => s.delete(k)); return done(t); }
  };
}
function memStore(names = STORES) {
  const m = Object.fromEntries(names.map(s => [s, new Map()]));
  return {
    all: async n => [...m[n].values()],
    get: async (n, k) => m[n].get(k),
    put: async (n, vals) => vals.forEach(v => m[n].set(v[KEYS[n]], v)),
    del: async (n, keys) => keys.forEach(k => m[n].delete(k))
  };
}
function openDB() {
  return new Promise((res, rej) => {
    // the database keeps its first name from when the app was called Subtext: renaming it would leave every saved card behind
    // No version number: the cards' database opens exactly as it is and is never upgraded. An upgrade has to wait until every
    // other copy of Agora lets go of it, and an older copy left in a background Chrome tab never does (v23 opened to a black screen).
    // New kinds of data get a database of their own instead, like My Files' "agora-files".
    const r = indexedDB.open('subtext');
    r.onupgradeneeded = e => {
      if (e.oldVersion >= 1) return; // only a brand-new database is set up here
      const d = r.result;
      d.createObjectStore('decks', { keyPath: 'id' });
      d.createObjectStore('cards', { keyPath: 'id' }).createIndex('deckId', 'deckId');
      d.createObjectStore('blobs', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => { const db = r.result; db.onversionchange = () => db.close(); res(db); };
    r.onerror = () => rej(r.error);
  });
}

let store = memStore();
let mainDB = null; // the cards' database itself, to see which stores it has
let decks = [];
let cards = [];

const deckCards = id => cards.filter(c => c.deckId === id).sort((a, b) => a.seq - b.seq);
const nextSeq = id => cards.reduce((m, c) => c.deckId === id ? Math.max(m, c.seq) : m, 0) + 1;
const saveCards = list => store.put('cards', list).catch(storageFail);
const saveDeck = d => store.put('decks', [d]).catch(storageFail);
function storageFail(e) { console.error(e); toast('Couldn’t save. Your phone may be out of space.'); }

/* image urls */
const urls = new Map();
const thumbIds = new Set();
async function blobURL(id) {
  if (!id) return '';
  if (urls.has(id)) return urls.get(id);
  const rec = await store.get('blobs', id).catch(() => null);
  if (!rec) return '';
  const u = URL.createObjectURL(rec.blob);
  urls.set(id, u);
  return u;
}
function releaseFull() {
  for (const [id, u] of urls) if (!thumbIds.has(id)) { URL.revokeObjectURL(u); urls.delete(id); }
}
async function makeThumb(blob, max = 560) {
  try {
    let src;
    try { src = await createImageBitmap(blob); }
    catch {
      src = new Image(); const u = URL.createObjectURL(blob); src.src = u;
      await src.decode(); URL.revokeObjectURL(u);
    }
    const w = src.width, h = src.height, s = Math.min(1, max / w);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    return out || blob;
  } catch { return blob; }
}
function newDeck(name) {
  const d = { id: uid(), name: name.trim(), sort: 'added', createdAt: Date.now() };
  decks.push(d); saveDeck(d);
  return d;
}
async function addPair(deck, frame, def, extra = {}) {
  const thumb = await makeThumb(frame);
  const defBlobs = Array.isArray(def) ? def : [def];
  const ids = { frameId: uid(), thumbId: uid(), defIds: defBlobs.map(b => b ? uid() : '') };
  ids.defId = ids.defIds[0];
  await store.put('blobs', [{ id: ids.frameId, blob: frame }, { id: ids.thumbId, blob: thumb }, ...defBlobs.map((b, i) => b && ({ id: ids.defIds[i], blob: b })).filter(Boolean)]);
  const card = Object.assign({
    id: uid(), deckId: deck.id, seq: nextSeq(deck.id), word: '',
    review: false, streak: 0, peeks: 0, seen: 0, lastSeen: 0, addedAt: Date.now(), shotAt: frame.lastModified || 0
  }, extra, ids, { deckId: deck.id });
  if (extra.seq == null) card.seq = nextSeq(deck.id);
  cards.push(card);
  await store.put('cards', [card]);
  thumbIds.add(card.thumbId);
  return card;
}
async function deleteCards(list) {
  const ids = new Set(list.map(c => c.id));
  cards = cards.filter(c => !ids.has(c.id));
  const blobIds = list.flatMap(c => [c.frameId, c.thumbId, ...defIdsOf(c), c.ref && c.ref.thumbId]).filter(Boolean);
  // a magazine page can be shared by several cards: it goes with the last one
  new Set(list.map(c => c.pdf && c.pdf.id).filter(Boolean)).forEach(id => { if (!cards.some(c => c.pdf && c.pdf.id === id)) blobIds.push(id); });
  blobIds.forEach(id => { if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } thumbIds.delete(id); });
  await store.del('cards', [...ids]).catch(storageFail);
  await store.del('blobs', blobIds).catch(storageFail);
  // and out of any deck made inside a deck
  const touched = decks.filter(d => subsOf(d).some(sb => (sb.cards || []).some(id => ids.has(id))));
  touched.forEach(d => subsOf(d).forEach(sb => { sb.cards = (sb.cards || []).filter(id => !ids.has(id)); }));
  if (touched.length) await store.put('decks', touched).catch(storageFail);
}
function askPersist() { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }

/* ================= navigation (Android back) ================= */
const stack = [];
let histOK = true, afterPop = null;
function pushLayer(onPop) {
  stack.push(onPop);
  try { history.pushState({ agora: stack.length }, ''); } catch { histOK = false; }
}
let ownBack = false; // true while a Back started inside the app (a swipe, a button): those keep their animation
function back(then, n = 1) {
  n = Math.min(n, stack.length);
  if (!n) { then && then(); return; }
  if (histOK) { afterPop = then || null; ownBack = true; history.go(-n); }
  else { for (let k = 0; k < n; k++) stack.pop()(); then && then(); }
}
addEventListener('popstate', e => {
  // the phone's Back button only performs the action: turn transitions off for this step
  if (!ownBack) { const r = document.documentElement; r.classList.add('noanim'); requestAnimationFrame(() => requestAnimationFrame(() => r.classList.remove('noanim'))); }
  ownBack = false;
  const depth = (e.state && e.state.agora) || 0;
  while (stack.length > depth) { const f = stack.pop(); if (f) f(); }
  const t = afterPop; afterPop = null; if (t) t();
});
try { if (history.state && (history.state.agora || history.state.subtext)) history.replaceState(null, ''); } catch {}

/* the page underneath stops scrolling while anything covers it */
function unlockIdle() { if (!pages.length && !cardsView && !searchView && !S && !FV) document.body.classList.remove('locked'); }

/* ================= toast ================= */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), Math.min(5200, 2400 + String(msg).length * 30));
}

/* ================= sheet ================= */
let sheetOpen = false, sheetActions = {}, sheetCleanup = null;
function sheet(html, actions = {}, onMount) {
  const sh = $('#sheet'), sc = $('#scrim');
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  sh.classList.remove('asking');
  sh.innerHTML = '<div class="grab"></div>' + html;
  sheetActions = actions;
  if (!sheetOpen) {
    sheetOpen = true; sh.hidden = false; sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('open'); sc.classList.add('open'); }));
    pushLayer(hideSheet);
  }
  sh.scrollTop = 0;
  if (onMount) onMount(sh);
}
function hideSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  sheetOpen = false; sh.classList.remove('open'); sc.classList.remove('open');
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  setTimeout(() => { if (!sheetOpen) { sh.hidden = true; sc.hidden = true; sh.innerHTML = ''; } }, 340);
}
/* the keyboard covers the bottom of the screen without resizing the page: keep sheets just above it */
if (window.visualViewport) {
  const vv = visualViewport, fit = () => document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) + 'px');
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
}
function closeSheet(then) { if (sheetOpen) back(then); else if (then) then(); }
$('#scrim').addEventListener('click', () => closeSheet());
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = sheetActions[b.dataset.act]; if (f) f(b);
});
$('#sheet').addEventListener('submit', e => {
  e.preventDefault(); const f = sheetActions.submit; if (f) f(e.target);
});
const item = (act, label, detail = '', cls = '', desc = '') =>
  `<button class="item ${cls}" data-act="${act}"><span class="lbl"><span>${label}</span>${desc ? `<span class="desc">${desc}</span>` : ''}</span><span class="detail">${detail}</span></button>`;

/* ================= home ================= */
function renderHome() {
  const el = $('#home');
  const list = [...decks].sort((a, b) => b.createdAt - a.createdAt);
  const total = cards.length;
  const tiles = list.map(d => {
    const cs = deckCards(d.id), n = cs.length;
    // Vocabulary has its own logo instead of a card's picture
    const cover = d === studyDeck() ? '' : coverOf(d, cs);
    return `<div class="tile">
      <button class="tile-open" data-open="${d.id}" aria-label="Open ${esc(d.name)}">
        <div class="cover">${d === studyDeck() ? LOGO_VOCAB : cover ? `<img alt="" data-blob="${cover}">` : ''}</div>
        <div><div class="tile-name">${esc(d.name)}</div>
        <div class="tile-meta">${plural(n, 'card')}</div></div>
      </button>
      <button class="more" data-menu="${d.id}" aria-label="Options for ${esc(d.name)}">${ICON.more}</button>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="bar title"><h1>Your decks</h1>
      <span class="tools"><button class="iconbtn" id="searchBtn" aria-label="Search words">${ICON.search}</button><button class="iconbtn" id="appMenu" aria-label="Backup and import">${ICON.more}</button></span></div>
    <p class="summary">${list.length ? `${plural(list.length, 'deck')} · ${plural(total, 'card')}` : 'Make a deck for each film or show you watch.'}</p>
    <div class="grid">${tiles}
      ${filesTile()}
      <div class="tile new"><button class="tile-open" data-new="1"><div class="cover">${ICON.plus}</div><div class="tile-name">New deck</div></button></div>
    </div>${fsOffLine()}`;
  $$('img[data-blob]', el).forEach(img => {
    thumbIds.add(img.dataset.blob);
    blobURL(img.dataset.blob).then(u => { if (!u) return; img.onload = () => img.classList.add('in'); img.src = u; });
  });
}
$('#home').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const deck = id => decks.find(d => d.id === id);
  if (t.dataset.open) openDeck(deck(t.dataset.open));
  else if (t.dataset.menu) deckMenu(deck(t.dataset.menu));
  else if (t.dataset.new) nameSheet(null);
  else if (t.dataset.files) openFolder('');
  else if (t.dataset.fmenu) filesMenu(null);
  else if (t.id === 'appMenu') appMenu();
  else if (t.id === 'searchBtn') openSearch();
});

/* ================= deck sheets ================= */
/* a deck's cover: a photo chosen for it, or a card chosen as cover, or the first card in the deck's order */
function coverOf(d, cs = deckCards(d.id)) {
  if (d.coverId) return d.coverId;
  const pick = d.coverCard && cs.find(c => c.id === d.coverCard);
  const c = pick || defaultOrder(cs)[0];
  return c ? c.thumbId : '';
}
function coverSheet(d) {
  const cs = defaultOrder(deckCards(d.id)), cur = d.coverId ? '' : (d.coverCard && cs.some(c => c.id === d.coverCard) ? d.coverCard : (cs[0] && cs[0].id));
  sheet(`<h2>Cover image</h2><p class="sub">${esc(d.name)}</p>
    <div class="cgrid">${cs.map(c => `<button class="cpick${c.id === cur ? ' on' : ''}" data-act="card" data-id="${c.id}" aria-label="Use ${esc(c.word || 'this card')} as cover"><img alt="" data-blob="${c.thumbId}"></button>`).join('')}</div>
    <div class="list">
      ${item('photo', ico('image', 'Choose a photo'), d.coverId ? `<span class="tick">${ICON.check}</span>` : '', '', 'From your gallery, cropped to fit')}
      ${d.coverId || d.coverCard ? item('reset', ico('back', 'Use the first card'), '', '', 'Follows the deck’s order') : ''}
    </div>`, {
    card: b => { const old = d.coverId; d.coverCard = b.dataset.id; d.coverId = ''; saveDeck(d); if (old) forget([old]); renderHome(); closeSheet(); toast('Cover updated'); },
    photo: () => pickOne(async f => {
      const old = d.coverId; d.coverId = await putImage(await makeThumb(f, 900)); d.coverCard = ''; thumbIds.add(d.coverId);
      saveDeck(d); if (old) forget([old]); renderHome(); closeSheet(); toast('Cover updated');
    }),
    reset: () => { const old = d.coverId; d.coverId = ''; d.coverCard = ''; saveDeck(d); if (old) forget([old]); renderHome(); closeSheet(); toast('Cover follows the first card'); }
  }, sh => $$('img[data-blob]', sh).forEach(img => { thumbIds.add(img.dataset.blob); blobURL(img.dataset.blob).then(u => { if (u) img.src = u; }); }));
}
function deckMenu(d) {
  const n = deckCards(d.id).length;
  sheet(`<h2>${esc(d.name)}</h2>
    <p class="sub">${plural(n, 'card')}</p>
    <div class="list">
      ${n ? item('study', 'Study') : ''}
      ${item('add', 'Add cards')}
      ${n ? item('browse', 'Browse cards') : ''}
      ${item('rename', 'Rename')}
      ${n && d !== studyDeck() ? item('cover', 'Cover image') : ''}
      ${n ? item('merge', 'Merge into another deck', '', '', 'Moves every card, then removes this deck') : ''}
      ${item('del', 'Delete deck', '', 'danger')}
    </div>`, {
    study: () => closeSheet(() => d === studyDeck() ? (SD.loaded && openStudyPage(d)) : openStudy(d)),
    add: () => addFlow(d),
    browse: () => closeSheet(() => openCards(d)),
    rename: () => nameSheet(d),
    cover: () => coverSheet(d),
    merge: () => mergeSheet(d),
    del: () => confirmDeleteDeck(d)
  });
}
/* merge: every card keeps its tags, review marks and progress; only the deck it sits in changes */
function mergeSheet(d) {
  const list = deckCards(d.id);
  const others = decks.filter(x => x.id !== d.id).sort((a, b) => a.name.localeCompare(b.name));
  sheet(`<h2>Merge “${esc(d.name)}”</h2><p class="sub">Move its ${plural(list.length, 'card')} into</p>
    <div class="list">${others.map(x => item('to', esc(x.name), `<span class="num">${deckCards(x.id).length}</span>`).replace('data-act="to"', `data-act="to" data-id="${x.id}"`)).join('')}
    ${item('fresh', 'New deck…')}</div>`, {
    to: b => doMerge(d, decks.find(x => x.id === b.dataset.id)),
    fresh: () => nameSheet(null, nd => doMerge(d, nd))
  });
}
async function doMerge(d, target) {
  const list = deckCards(d.id).sort((a, b) => a.seq - b.seq);
  let s = nextSeq(target.id);
  list.forEach(c => { c.deckId = target.id; c.seq = s++; });
  try { await store.put('cards', list); } catch (e) { storageFail(e); return; }
  // the old deck is empty now: drop it (its cover photo too, unless it was one of the cards)
  if (subsOf(d).length) { target.subs = [...subsOf(target), ...subsOf(d)]; saveDeck(target); }
  if (d.coverId) forget([d.coverId]);
  decks = decks.filter(x => x.id !== d.id);
  await store.del('decks', [d.id]).catch(storageFail);
  renderHome(); closeSheet(); toast(`Moved ${plural(list.length, 'card')} to ${target.name}`);
}
function nameSheet(d, then) {
  askSheet({ title: d ? 'Rename deck' : 'New deck', value: d ? d.name : '', placeholder: 'e.g. Vocabulary', btn: d ? 'Save' : 'Create deck', label: 'Deck name',
    done: v => {
      if (d) { d.name = v; saveDeck(d); renderHome(); refreshPages(); closeSheet(); toast('Renamed'); }
      else { const nd = newDeck(v); renderHome(); then ? then(nd) : addFlow(nd); }
    } });
}
/* a sheet that asks for one line of text (a deck's name, a card's word): a card floating just above the keyboard */
function askSheet({ title, sub = '', value = '', placeholder = '', btn = 'Save', label = '', empty = false, attrs = 'autocomplete="off" enterkeyhint="done"', done }) {
  sheet(`<form class="ask"><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}
    <div class="field"><input id="askIn" type="text" maxlength="80" ${attrs} value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${esc(label || title)}"></div>
    <div class="askbtns"><button type="button" class="textbtn quiet" data-act="cancel">Cancel</button><button type="submit" class="textbtn">${btn}</button></div></form>`, {
    cancel: () => closeSheet(),
    submit: f => { const i = $('#askIn', f), x = i.value.trim(); if (!x && !empty) { i.focus(); return; } done(x); }
  }, sh => { sh.classList.add('asking'); setTimeout(() => { const i = $('#askIn', sh); if (i) { i.focus(); i.select(); } }, 360); });
}
function confirmDeleteDeck(d) {
  const n = deckCards(d.id).length;
  sheet(`<h2>Delete “${esc(d.name)}”?</h2>
    <p class="note">${n ? `Its ${plural(n, 'card')} and their screenshots will be removed from Agora. ` : ''}This can’t be undone.</p>
    <div class="btns"><button class="btn" data-act="cancel">Keep it</button><button class="btn danger" data-act="yes">Delete</button></div>`, {
    cancel: () => deckMenu(d),
    yes: async () => {
      await deleteCards(deckCards(d.id)); if (d.coverId) forget([d.coverId]);
      decks = decks.filter(x => x.id !== d.id);
      await store.del('decks', [d.id]).catch(storageFail);

/* ================= Study: new cards each day on a fixed cycle ================= */
/* The Study deck sits inside Vocabulary. A card waits in the queue of new cards (never overdue) until the day you first study it;
   from then on it comes back after 1, 3, 7, 14, 30, 60 and 120 days, each gap counted from the day you passed it, and then it is done.
   Each day brings 20 new cards (a setting) plus every review that is due.
   Progress lives in a database of its own, "agora-study", so the cards' database is never upgraded:
     store `cards`: {id, step, due, first, last, at, done?} for a card you have studied (step: how many gaps it has passed),
                    {id, front, at} for a new card brought to the front of the queue;
     store `meta`:  {k: 'daily', v} new cards a day, {k: 'extra', day, n} more new cards asked for today. */
const GAPS = [1, 3, 7, 14, 30, 60, 120];
const SD = { recs: new Map(), daily: 20, dailySet: false, extra: null, loaded: false };
let sstore = memStore(['cards', 'meta']);
function openStudyDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('agora-study', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('cards', { keyPath: 'id' }); d.createObjectStore('meta', { keyPath: 'k' }); };
    r.onsuccess = () => { const db = r.result; db.onversionchange = () => db.close(); res(db); };
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
async function loadStudy() {
  try { sstore = idbStore(await openStudyDB()); } catch (e) { console.warn('study storage unavailable, using memory', e); }
  try {
    (await sstore.all('cards')).forEach(r => SD.recs.set(r.id, r));
    const m = await sstore.get('meta', 'daily'); if (m && m.v > 0) { SD.daily = m.v; SD.dailySet = true; }
    SD.extra = (await sstore.get('meta', 'extra')) || null;
  } catch (e) { console.warn('study progress', e); }
  SD.loaded = true;
}

const frontOf = c => { const r = recOf(c); return r && r.step == null && r.front != null ? r.front : null; };
const studyDeck = () => decks.find(d => norm(d.name) === 'vocabulary') || null;

function queueOrder(d = studyDeck()) {

  list.forEach((c, i) => { const s = srcOf(c); if (!SRC_STORY.has(s.kind.toLowerCase())) return; if (!groups.has(s.key)) groups.set(s.key, []); groups.get(s.key).push(i); });
  for (const idx of groups.values()) {
    if (idx.length < 2) continue;

    learning: all.filter(c => studied(c) && !recOf(c).done).length, finished: all.filter(c => studied(c) && recOf(c).done).length };

    if (s.isConnected) { s.innerHTML = otherHTML(r); toast(navigator.onLine === false && k === 'pdf' ? 'Connect to the internet once to show PDFs' : `Couldn’t open ${r.name}. If it was moved, refresh My Files.`); }

}
/* a PDF: every page fits the width and scrolls; pages are drawn as they come into view, sharper after a zoom */
async function openPdfFile(s, f) {
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise;
  if (!s.isConnected) { doc.destroy(); return; }
  const v1 = (await doc.getPage(1)).getViewport({ scale: 1 });
  const P = s.P = { doc, n: doc.numPages, s: 1, cur: 1, ar: Array(doc.numPages).fill(v1.height / v1.width), sc: $('.vpdf', s), wrap: $('.vpages', s) };
  P.wrap.innerHTML = Array.from({ length: P.n }, (_, i) => `<div class="vpage" data-pg="${i + 1}"></div>`).join('');
  pdfFit(P);
  P.io = new IntersectionObserver(es => es.forEach(e => { e.target.vis = e.isIntersecting; if (e.isIntersecting) pdfDraw(P, e.target); }), { root: P.sc, rootMargin: '60% 0px' });

  P.sc.addEventListener('scroll', () => {
    const mid = P.sc.scrollTop + P.sc.clientHeight / 2; let cur = 1;
    for (const d of P.wrap.children) { if (d.offsetTop <= mid) cur = +d.dataset.pg; else break; }
    if (cur !== P.cur) { P.cur = cur; if (FV && FV.slide === s) showFileHead(); }
  }, { passive: true });
  pdfPinch(P);
  const w = $('.vwait', s); if (w) w.remove();
  if (FV && FV.slide === s) showFileHead();
}
function pdfFit(P) {
  const pw = P.sc.clientWidth * P.s;
  [...P.wrap.children].forEach((d, i) => { d.style.width = pw + 'px'; d.style.height = pw * P.ar[i] + 'px'; d.style.marginBottom = 8 * P.s + 'px'; });
  P.sc.classList.toggle('zoomed', P.s > 1.01);
}
async function pdfDraw(P, d) {
  const n = +d.dataset.pg, cssW = d.offsetWidth, dpr = Math.min(3, window.devicePixelRatio || 1);
  const want = Math.round(Math.min(cssW * dpr, 4096, Math.sqrt(12e6 / P.ar[n - 1])));
  if (d.pxW && want <= d.pxW * 1.1 && want >= d.pxW * 0.5) return; // sharp enough already
  const job = d.job = (d.job || 0) + 1;
  try {
    const page = await P.doc.getPage(n), base = page.getViewport({ scale: 1 }), ar = base.height / base.width;
    if (Math.abs(ar - P.ar[n - 1]) > 0.005) { P.ar[n - 1] = ar; d.style.height = d.offsetWidth * ar + 'px'; }
    const vp = page.getViewport({ scale: want / base.width }), c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (job === d.job && d.isConnected) { d.replaceChildren(c); d.pxW = want; }
  } catch (e) { if (P.doc) console.warn(e); }
}
/* zoom about a point (mx, my inside the page area): the spot under the fingers stays put */
function pdfZoom(P, s2, mx, my, anim) {
  s2 = Math.min(5, Math.max(1, s2));
  const k = s2 / P.s, cx = P.sc.scrollLeft + mx, cy = P.sc.scrollTop + my;
  const commit = () => {
    if (!P.doc) return;
    P.wrap.style.transition = ''; P.wrap.style.transform = '';
    P.s = s2; pdfFit(P); P.sc.scrollLeft = cx * k - mx; P.sc.scrollTop = cy * k - my;
    clearTimeout(P.rt); P.rt = setTimeout(() => [...P.wrap.children].filter(d => d.vis).forEach(d => pdfDraw(P, d)), 120);
  };
  if (!anim) { commit(); return; }
  P.wrap.style.transformOrigin = `${cx}px ${cy}px`; P.wrap.style.transition = 'transform .24s var(--ease)'; P.wrap.style.transform = `scale(${k})`;

/* two fingers on a PDF: the pages scale while the fingers move, then settle at the new size */
function pdfPinch(P) {
  let pz = null;
  const two = e => { const [a, b] = e.touches, r = P.sc.getBoundingClientRect(); return { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), x: (a.clientX + b.clientX) / 2 - r.left, y: (a.clientY + b.clientY) / 2 - r.top }; };

    P.wrap.style.transform = `scale(${pz.k})`;
  }, { passive: false });
  const end = e => { if (pz && e.touches.length < 2) { const p = pz; pz = null; pdfZoom(P, P.s * p.k, p.x, p.y, false); if (FV) FV.pinched = Date.now(); } };
  P.sc.addEventListener('touchend', end); P.sc.addEventListener('touchcancel', end);

/* pictures: pinch, double tap and drag to look closer; a sideways swipe moves to the next file */
function viewerGestures(V) {
  const st = V.stage, pts = new Map();
  let g = null, lastTap = null;
  const kind = () => V.slide ? fkind(V.slide.r) : '';
  const img = () => V.slide && $('img.full', V.slide);
  const centre = () => { const r = st.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; };
  const clampZ = z => {
    const im = img(), c = centre(); if (!im || !im.naturalWidth) return { s: 1, x: 0, y: 0 };
    const fit = Math.min(c.w / im.naturalWidth, c.h / im.naturalHeight), mx = Math.max(0, (im.naturalWidth * fit * z.s - c.w) / 2), my = Math.max(0, (im.naturalHeight * fit * z.s - c.h) / 2);
    return { s: z.s, x: Math.min(mx, Math.max(-mx, z.x)), y: Math.min(my, Math.max(-my, z.y)) };
  };
  const applyZ = anim => { const im = img(); if (!im) return; im.style.transition = anim ? 'transform .25s var(--ease)' : 'none'; im.style.transform = `translate(${V.z.x}px,${V.z.y}px) scale(${V.z.s})`; };
  const zoomAt = (s, px, py, anim) => { const c = centre(), z = V.z, ux = (px - c.x - z.x) / z.s, uy = (py - c.y - z.y) / z.s; V.z = clampZ({ s, x: px - c.x - ux * s, y: py - c.y - uy * s }); applyZ(anim); };
  st.addEventListener('pointerdown', e => {
    if (e.target.closest('video,audio,button')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      g = kind() === 'img' ? { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y), s0: V.z.s, m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } } : { multi: true };
      if (V.slide) { V.slide.classList.remove('drag'); V.slide.style.transform = ''; V.slide.style.opacity = ''; }
    } else if (pts.size === 1) g = { x0: e.clientX, y0: e.clientY, t0: Date.now(), z0: { ...V.z }, dir: null };
  });
  st.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (g.multi) return;
    if (g.pinch) {
      if (pts.size < 2) return;
      const [a, b] = [...pts.values()], m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      zoomAt(Math.min(5, Math.max(1, g.s0 * Math.hypot(a.x - b.x, a.y - b.y) / g.d0)), g.m.x, g.m.y, false);
      V.z = clampZ({ s: V.z.s, x: V.z.x + m.x - g.m.x, y: V.z.y + m.y - g.m.y }); g.m = m; applyZ(false);

    }

    if (V.z.s > 1.01 && kind() === 'img') { V.z = clampZ({ s: V.z.s, x: g.z0.x + dx, y: g.z0.y + dy }); applyZ(false); g.dir = 'pan'; return; }
    if (!g.dir && Math.hypot(dx, dy) > 10) g.dir = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    const P = V.slide && V.slide.P;
    if (g.dir === 'x' && !(P && P.s > 1.01)) { V.slide.classList.add('drag'); V.slide.style.transform = `translateX(${dx}px)`; V.slide.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 800)); }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!g) return;
    if (g.pinch || g.multi) { if (!pts.size) { if (g.pinch && V.z.s < 1.04) { V.z = { s: 1, x: 0, y: 0 }; applyZ(true); } g = null; } return; }

      s.classList.remove('drag');

      if (step && j >= 0 && j < V.order.length) showFile(j, step); else { s.style.transform = ''; s.style.opacity = ''; }
    } else if (!g.dir && dt < 300 && e.type === 'pointerup' && !(V.pinched && Date.now() - V.pinched < 400)) {

        if (kind() === 'img') { if (V.z.s > 1.01) { V.z = { s: 1, x: 0, y: 0 }; applyZ(true); } else zoomAt(2.5, e.clientX, e.clientY, true); }

function viewerClick(e) {
  const b = e.target.closest('[data-v]'); if (!b || !FV) return;
  const v = b.dataset.v, r = fileNow();
  if (v === 'back') back();
  else if (v === 'share') shareFiles([r.path]);
  else if (v === 'more') viewerMenu(r);
  else if (v === 'connect') connectFiles().then(ok => { if (ok && FV) loadFull(FV.slide); });
  else if (v === 'untag') { const t = b.closest('.tag').dataset.tag; setFileTags([r.path], withoutTag(t)); showFileHead(); refreshFiles(); toast(`Removed the tag “${t}” from this file`); }
  else if (v === 'moretags') { FV.tagsOpen = !FV.tagsOpen; showFileHead(); }
  else if (v === 'addtag') fileTagSheet([r.path]);
  else if (v === 'tag') {
    if (FV.hold.fired) { FV.hold.fired = false; return; }
    const tg = $('.tags', FV.el); if (tg.classList.contains('editing')) { tg.classList.remove('editing'); fitViewer(); return; }
    const t = b.dataset.tag; back(() => openSearch([t]));
  }
}
function viewerMenu(r) {
  sheet(`<h2>${esc(r.name)}</h2><p class="sub num">${fmeta(r)}</p>
    <div class="list">
      ${item('tag', ico('tag', 'Tags'), '', '', 'Or hold a tag and tap +')}
      ${item('share', ico('share', 'Share / Open with…'))}
      ${item('folder', ico('folder', 'Show in folder'), '', '', esc(['My Files', ...(r.dir ? r.dir.split('/') : [])].join(' › ')))}
    </div>`, {
    tag: () => fileTagSheet([r.path]),
    share: () => { shareFiles([r.path]); closeSheet(); },
    folder: () => {
      const under = pages[pages.length - 1], there = under && under.kind === 'files' && under.dir === r.dir;
      back(() => { if (!there) openFolder(r.dir); }, 2); // the sheet and the file
    }
  });
}

/* search: file and folder names, then files whose tags contain the words typed */
function findFiles(q, pool) {
  const n = norm(q); if (!n) return [];
  const out = [];
  for (const r of pool) {
    const nm = norm(r.name), i = nm.indexOf(n);
    if (i >= 0) out.push({ r, i, rank: i === 0 ? 0 : (/[\s\-_.]/.test(nm[i - 1]) ? 1 : 2) });
    else if (n.length >= 2 && fileTags(r).some(t => norm(t).includes(n))) out.push({ r, i: -1, rank: 3 });
  }
  return out.sort((a, b) => a.rank - b.rank || (a.r.kind === 'dir' ? 0 : 1) - (b.r.kind === 'dir' ? 0 : 1) || nameCmp(a.r, b.r)).slice(0, 80);
}
function fileResults(list, titleOf) {
  if (!searchView) return '';
  searchView.fhits = list;
  if (!list.length) return '';
  const nd = list.filter(r => r.kind === 'dir').length, nf = list.length - nd;
  return `<div class="rhead fhead"><span class="num">${[nd ? plural(nd, 'folder') : '', nf ? plural(nf, 'file') : ''].filter(Boolean).join(' · ')}</span></div>`
    + list.map(r => `<button class="res" data-fopen="${esc(r.path)}">${r.thumbId ? `<img alt="" class="fth" data-blob="${r.thumbId}">` : `<span class="gly">${r.kind === 'dir' ? ICON_FOLDER(24) : ICON_DOC(22)}</span>`}
      <span><span class="rw">${titleOf(r)}</span><span class="rd">${r.kind === 'dir' ? `Folder · ${plural(deepCount(r.path), 'file')}` : `${esc(kindLabel(r))} · ${esc(fname(r.dir))}`}</span></span></button>`).join('');
}

/* ================= start ================= */
async function seed() {
  const m = await store.get('meta', 'seeded').catch(() => null);
  if (m) return;
  await store.put('meta', [{ k: 'seeded', v: 1 }]).catch(() => {});
  try {
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.blob(); });
    const [f, d] = await Promise.all([get('sample/frame.jpg'), get('sample/definition.jpg')]);
    const deck = newDeck('Slow Horses');
    await addPair(deck, f, d, { word: 'squaddie' });
  } catch (e) { console.warn('sample skipped', e); }
}
(async () => {
  // if the cards take more than a moment (another copy of Agora holding the database), say so instead of a black screen
  const slow = setTimeout(() => { $('#home').innerHTML = '<p class="empty">Opening your cards…</p><p class="note">If Agora is also open in a Chrome tab, close that tab and Agora will carry on.</p>'; }, 2500);
  try { mainDB = await openDB(); store = idbStore(mainDB); } catch (e) { console.warn('IndexedDB unavailable, using memory', e); }
  clearTimeout(slow);
  try { decks = await store.all('decks'); cards = await store.all('cards'); } catch { decks = []; cards = []; }
  cards.forEach(c => { if (!c.defIds || !c.defIds.length) c.defIds = [c.defId]; });
  try {
    if (!(await store.get('meta', 'reviewRules2'))) {
      const marked = cards.filter(c => c.review);
      marked.forEach(c => { c.review = false; c.streak = 0; });
      if (marked.length) await store.put('cards', marked);
      await store.put('meta', [{ k: 'reviewRules2', v: 1 }]);
    }
  } catch (e) { console.warn(e); }
  addEventListener('resize', () => { if (S) fitBands(); });
  try { renderHome(); }
  catch (e) { console.error(e); $('#home').innerHTML = `<p class="empty">Agora couldn’t show your decks. Close it and open it again.</p><p class="note">${esc(e.message)}</p>`; }
  // the files index loads after the decks are on screen, so My Files can never hold them up
  loadFiles().then(renderHome, e => console.warn(e));
  loadStudy().then(refreshPages, e => console.warn(e));
  if (!decks.length) { await seed(); renderHome(); }
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
